<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Disfruta">
<link rel="apple-touch-icon" href="icon.png">
<title>Disfruta la Vida</title>
<style>

:root{
  --papel:#F4F6F5; --superficie:#FFFFFF; --tinta:#17232F; --pizarra:#5B6B78;
  --pluma:#1F5C8B; --hoja:#2C7A57; --granate:#9E3434; --linea:#D6DEDB; --suave:#E9EEEC;
  --liq:#7FA7C9; --fon:#1F5C8B; --acc:#2C7A57; --brk:#B9C7C2; --deu:#9E3434;
  --r1:6px; --r2:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#14202A; --superficie:#1B2A36; --tinta:#E6ECEF; --pizarra:#9AAAB6;
  --pluma:#7FB2DE; --hoja:#6CC398; --granate:#E08A8A; --linea:#2B3B48; --suave:#223340;
  --liq:#4E7EA6; --fon:#7FB2DE; --acc:#6CC398; --brk:#4A5B66; --deu:#E08A8A;}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--papel);color:var(--tinta)}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:680px;margin:0 auto;padding:18px 18px 110px}
h1,h2{font-weight:600;margin:0}
h2{font-size:18px;margin:34px 0 10px}
p{margin:.4em 0}
.pie{color:var(--pizarra);font-size:13px}
a{color:var(--pluma)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pluma);outline-offset:2px}
.btn{background:var(--pluma);color:#fff;border:0;border-radius:var(--r1);padding:9px 14px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--pluma);border:1px solid var(--linea)}
.btn.peligro{background:transparent;color:var(--granate);border:1px solid var(--linea)}
/* navegación */
nav.pestanas{position:fixed;left:0;right:0;bottom:0;background:var(--superficie);border-top:1px solid var(--linea);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.pestanas .fila{display:flex;gap:2px;overflow-x:auto;max-width:680px;margin:0 auto;scrollbar-width:none}
nav.pestanas .fila::-webkit-scrollbar{display:none}
nav.pestanas button{flex:0 0 auto;border:0;background:none;padding:8px 11px;border-radius:var(--r1);font-size:13.5px;color:var(--pizarra);cursor:pointer;white-space:nowrap}
nav.pestanas button[aria-current="page"]{background:var(--suave);color:var(--tinta);font-weight:600}
nav.pestanas button.luego{opacity:.55}
/* hoy */
.cifra{font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin:6px 0 2px}
.cifra small{font-size:24px;font-weight:500;color:var(--pizarra);margin-left:2px}
.tienes{font-size:17px;color:var(--pizarra);margin:8px 0 0}
.linea-res{font-size:14px;color:var(--pizarra)}
.pos{color:var(--hoja)} .neg{color:var(--granate)}
.regla{display:flex;height:34px;border-radius:var(--r2);overflow:hidden;margin:22px 0 10px;background:var(--suave)}
.regla span{display:block;height:100%;min-width:3px}
.leyenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 18px;margin:0;padding:0;list-style:none}
.leyenda li{display:grid;grid-template-columns:10px 1fr;column-gap:8px;align-items:baseline}
.leyenda i{width:10px;height:10px;border-radius:2px;display:inline-block}
.leyenda b{grid-column:2;font-size:17px;font-weight:600}
.leyenda span{grid-column:2;font-size:13px;color:var(--pizarra)}
.leyenda li{cursor:pointer;border-radius:var(--r1);padding:4px 6px;margin:-4px -6px}
.leyenda li.sel{background:var(--suave)}
.desglose{margin:10px 0 0;padding:12px 14px;background:var(--superficie);border-radius:var(--r1);border:1px solid var(--linea)}
.desglose table{width:100%;border-collapse:collapse;font-size:14px}
.desglose td{padding:4px 0}
.desglose td:last-child{text-align:right}
.desglose .sub{color:var(--pizarra);font-size:12px}
/* pendientes */
.pend{list-style:none;margin:0;padding:0}
.pend li{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--linea)}
.pend li:last-child{border-bottom:0}
.pend .marca{border-radius:2px;background:var(--linea)}
.pend .grave .marca{background:var(--granate)}
.pend .que{font-size:14.5px}
.pend .hacer{font-size:13px;color:var(--pluma)}
.vacio{padding:14px;border:1px dashed var(--linea);border-radius:var(--r1);color:var(--pizarra);font-size:14px}
/* gráfico */
.grafico{width:100%;height:auto;display:block;margin-top:6px}
.grafico .area{fill:var(--pluma);opacity:.12}
.grafico .trazo{fill:none;stroke:var(--pluma);stroke-width:1.6}
.grafico .eje{fill:var(--pizarra);font-size:10px}
.grafico .hueco{fill:var(--granate);opacity:.07}
.grafico .punto{fill:var(--pluma)}
/* fuentes */
.fuentes{width:100%;border-collapse:collapse;font-size:14px}
.fuentes td{padding:6px 0;border-bottom:1px solid var(--linea)}
.fuentes td:last-child{text-align:right;color:var(--pizarra)}
.fuentes .viejo{color:var(--granate)}
/* buzón */
.bloque{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--r1);padding:14px 16px;margin:12px 0}
.bloque h3{font-size:15px;margin:0 0 4px}
.bloque .acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.estado{font-size:14px;line-height:1.7}
.aviso{margin-top:12px;padding:10px 12px;border-radius:var(--r1);background:var(--suave);font-size:13.5px}
.aviso.ok{border-left:3px solid var(--hoja)} .aviso.mal{border-left:3px solid var(--granate)}
@media (prefers-reduced-motion:no-preference){.regla span{transition:flex-grow .5s ease}}
@media (max-width:420px){.cifra{font-size:40px}.cifra small{font-size:20px}}

.suelta{border-style:dashed}
.suelta.encima{border-color:var(--pluma);background:var(--suave)}
.tarjeta h3{margin-bottom:0}
.tarjeta .estado{margin:.5em 0}
.tarjeta select{font:inherit;font-size:14px;padding:3px 6px;border:1px solid var(--linea);border-radius:var(--r1);background:var(--superficie);color:var(--tinta);max-width:100%}
.tarjeta input[type=checkbox]{width:17px;height:17px;vertical-align:-3px;margin-right:4px}

/* ── pantallas nuevas: lo común ── */
.t1{font-size:24px;margin:10px 0 4px}
.entrada{font-size:15px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.chips button{border:1px solid var(--linea);background:var(--superficie);color:var(--pizarra);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--papel);font-weight:600}
.filas{margin:16px 0 4px;border-top:1px solid var(--linea)}
.fila{display:grid;grid-template-columns:1fr auto;column-gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--linea)}
.fila .et{font-size:14.5px}
.fila .et small{display:block;font-size:12.5px;color:var(--pizarra);margin-top:1px}
.fila b{font-size:16px;font-weight:600;text-align:right;white-space:nowrap}
.fila.total b{font-size:18px}
.bloque.suave{background:var(--suave);border-color:transparent}
.lista-simple{list-style:none;margin:8px 0;padding:0}
.lista-simple li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--linea);font-size:14px}
.lista-simple li:last-child{border-bottom:0}
.lista-simple li>span:first-child{flex:1 1 200px}
.lista-simple small{color:var(--pizarra);font-size:12.5px}
.tabla-caja{overflow-x:auto;margin:6px 0}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th{font-weight:500;font-size:12.5px;color:var(--pizarra);text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--linea);white-space:nowrap}
.tabla th.n,.tabla td.n{text-align:right;padding-left:10px;padding-right:0}
.tabla td{padding:8px 8px 8px 0;border-bottom:1px solid var(--linea);vertical-align:top}
.tabla td small{display:block;color:var(--pizarra);font-size:12px;margin-top:1px}
.tabla tr.destaca td{font-weight:600}
.tabla tr.suma td{border-top:1px solid var(--tinta);font-weight:600}
.barrita{display:block;grid-column:1/-1;height:6px;border-radius:3px;background:var(--suave);overflow:hidden;margin-top:5px}
.barrita i{display:block;height:100%;border-radius:3px}
.cats{list-style:none;margin:6px 0;padding:0}
.cats>li{display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:baseline;padding:9px 6px;margin:0 -6px;border-radius:var(--r1);cursor:pointer}
.cats>li.sel{background:var(--suave)}
.cats .nom small{margin-left:8px;color:var(--pizarra);font-size:12.5px}
.cats>li.dentro-cat{display:block;cursor:auto;padding:0 0 10px}
.movs{list-style:none;margin:6px 0;padding:0}
.movs>li{border-bottom:1px solid var(--linea)}
.movs .mv{display:grid;grid-template-columns:66px 1fr auto;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 0;cursor:pointer;align-items:baseline}
.movs .mv .f{color:var(--pizarra);font-size:13px}
.campo textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--linea);border-radius:var(--r1);padding:8px 10px;background:var(--superficie);color:var(--tinta);resize:vertical}
.en-linea{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.movs .mv .d{font-size:14px;overflow-wrap:anywhere}
.movs .mv .d small{display:block;color:var(--pizarra);font-size:12px}
.movs li.comp .mv{color:var(--pizarra)}.movs li.comp .mv .num{text-decoration:line-through;text-decoration-thickness:1px}
.movs li.abierto{background:var(--suave);border-radius:var(--r1);padding:0 10px;margin:4px -10px}
.mv-acc{padding:4px 0 12px}
.recat{list-style:none;margin:8px 0;padding:0}
.recat>li{padding:12px 0;border-bottom:1px solid var(--linea)}
.recat>li.ig{color:var(--pizarra)}
.recat .que b{display:block;font-weight:600;overflow-wrap:anywhere}
.recat .que small{display:block;color:var(--pizarra);font-size:12.5px}
.recat .que small.pos{color:var(--hoja)}
.recat .ctl{margin-top:8px}
.campo{display:block;margin:10px 0 0}
.campo>span{display:block;font-size:13px;color:var(--pizarra);margin-bottom:3px}
.campo small{display:block;font-size:12px;color:var(--pizarra);margin-top:3px}
.campo input,.campo select,.chk input[type=text],.buscador input,.corto{font:inherit;font-size:16px;padding:7px 9px;border:1px solid var(--linea);border-radius:var(--r1);background:var(--superficie);color:var(--tinta);width:100%;max-width:100%}
.campo select{padding:7px 6px}
input.corto,.chk input.corto{width:auto;max-width:180px;font-size:15px;padding:4px 7px;display:inline-block}
.rango{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 12px}
.chk{display:block;font-size:13.5px;color:var(--pizarra);margin:8px 0 0}
.chk input[type=checkbox]{width:17px;height:17px;vertical-align:-3px;margin-right:6px}
.enlace{background:none;border:0;padding:2px 0;color:var(--pluma);font-size:13.5px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.acciones .btn,.acciones .enlace{min-height:36px}
.buscador{margin:6px 0 4px}
.buscador .chips{margin:8px 0 4px}
.checks{list-style:none;margin:8px 0;padding:0;max-height:340px;overflow:auto;border:1px solid var(--linea);border-radius:var(--r1)}
.checks li{padding:7px 10px;border-bottom:1px solid var(--linea);font-size:14px}
.checks li b{float:right}
.checks input.corto{margin:6px 0 0 24px;display:block}
.reemb{list-style:none;margin:6px 0;padding:0}
.reemb>li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--linea);font-size:14px}
.reemb ul{margin:4px 0 0 18px;padding:0;color:var(--pizarra);font-size:13.5px}
.h3{font-size:15px;margin:20px 0 4px}
details.plegable{margin:8px 0;border-top:1px solid var(--linea);border-bottom:1px solid var(--linea)}
details.plegable>summary{cursor:pointer;padding:10px 0;color:var(--pluma);font-size:14.5px;list-style:none}
details.plegable>summary::-webkit-details-marker{display:none}
details.plegable>summary::before{content:"▸";display:inline-block;width:1.1em;color:var(--pizarra)}
details.plegable[open]>summary::before{content:"▾"}
details.plegable>.dentro{padding:0 0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:9;max-width:min(92vw,560px);
  background:var(--tinta);color:var(--papel);padding:10px 14px;border-radius:var(--r1);font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.toast.mal{background:var(--granate);color:#fff}
.toast[hidden]{display:none}
.grafico .b-ing,.leyenda-mini i.b-ing{fill:var(--hoja);background:var(--hoja);opacity:.85}
.grafico .b-gas,.leyenda-mini i.b-gas{fill:var(--granate);background:var(--granate);opacity:.75}
.leyenda-mini{display:flex;gap:16px;font-size:12.5px;color:var(--pizarra);margin:2px 0 6px}
.leyenda-mini i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.grafico .trazo2{fill:none;stroke:var(--pizarra);stroke-width:1.3;stroke-dasharray:5 4}
.grafico .trazo3{fill:none;stroke:var(--hoja);stroke-width:1.5}
.grafico .marca-p{fill:var(--superficie);stroke:var(--pluma);stroke-width:1.5}
.cifra.neg{color:var(--granate)}
.nota{font-size:13px;color:var(--pizarra);margin:6px 0}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:12px 0}
.kpis div{padding:2px 0}
.kpis span{display:block;font-size:12.5px;color:var(--pizarra)}
.kpis b{display:block;font-size:19px;font-weight:600}
.kpis small{display:block;font-size:12px;color:var(--pizarra)}
.pos-lista{list-style:none;margin:6px 0;padding:0}
.pos-lista>li{border-bottom:1px solid var(--linea)}
.pos-lista .cab{display:grid;grid-template-columns:1fr auto;gap:10px;width:100%;text-align:left;background:none;border:0;padding:10px 0;cursor:pointer;align-items:baseline}
.pos-lista .cab small{display:block;color:var(--pizarra);font-size:12.5px}
.pos-lista .cab b{font-size:15.5px;text-align:right;white-space:nowrap}
.pos-lista .cab b small{font-weight:400}
.pos-lista li.abierto{background:var(--suave);border-radius:var(--r1);padding:0 10px;margin:4px -10px}
.pos-lista .det{padding:0 0 12px}
@media (max-width:420px){.movs .mv{grid-template-columns:54px 1fr auto;gap:8px}.tabla{font-size:13.5px}}
.lista-simple li>span:first-child>small{display:block;margin-top:1px}
.tabla input.corto{width:104px;max-width:104px;text-align:right;font-size:15px;padding:4px 6px}
.tabla small input.corto{width:64px;max-width:64px;margin-right:4px}
.tabla td:first-child input.corto{text-align:left;width:150px;max-width:150px}
.tabla td:first-child small input.corto{width:64px;max-width:64px;text-align:right}
.movs li.comp .mv b s{color:var(--pizarra);font-weight:500}

/* citas de la edición en blanco */
.cita{margin:8px 0 22px;padding:16px 18px 14px 20px;border-left:3px solid var(--pluma);background:var(--suave);border-radius:0 var(--r2,12px) var(--r2,12px) 0}
.cita blockquote{margin:0;font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Noto Serif",Georgia,serif;font-style:italic;font-size:17.5px;line-height:1.5;color:var(--tinta);text-wrap:pretty;hyphens:manual}
.cita blockquote::before{content:"\201C";color:var(--pluma);font-size:1.9em;line-height:0;vertical-align:-.36em;margin-right:3px;font-style:normal}
.cita blockquote::after{content:"\201D";color:var(--pluma);font-style:normal}
.cita figcaption{margin-top:10px;font-size:12.5px;color:var(--pizarra);letter-spacing:.02em;font-variant:small-caps}
.cita figcaption::before{content:"\2014\00a0"}
.cita cite{display:block;font-style:italic;font-variant:normal;letter-spacing:0;margin-top:1px;padding-left:1.2em}
.cita.ligera{background:none;padding:2px 0 2px 16px;margin:6px 0 20px}
.cita.ligera blockquote{font-size:18px}

</style>
</head>
<body>
<main id="main" aria-live="polite"></main>
<nav class="pestanas" aria-label="Pantallas"><div class="fila" id="nav"></div></nav>

  P.revision=function(){

  };

// ── Apuntes repetidos (v164) ─────────────────────────────────────────
// Tres casos, los tres con prueba de que es el mismo dinero:
//  · nómina del PDF (inc_nom_, día 28) y el cobro del banco del mismo mes, mismo importe
//  · intereses de Trade Republic el mismo día, uno en bruto y otro en neto (×0,81)
//  · un gasto que renombraste y el mismo gasto que el extracto volvió a meter:
//    mismo día, mismo importe, un nombre contiene al otro y entró después
(function(P){
  const tsId=id=>{const m=String(id).match(/_(\d{13})/);return m?+m[1]:null;};
  const pal=s=>(String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-zñ]{4,}/g)||[])
    .filter(w=>!['compra','pago','tarjeta','recibo','transferencia','espana','sociedad'].includes(w));
  P.duplicados=function(){
    const ci=compIncomeIds(), ce=compExpenseIds(), out=[], usados=new Set();
    const D=s=>Date.parse(String(s).slice(0,10));
    const I=incomeLog.filter(x=>!_esSintetico(x)&&!ci.has(x.id)&&x.src!=='compensacion');
    I.filter(e=>String(e.id).startsWith('inc_nom_')&&(e.cat==='nomina'||e.cat==='extra')).forEach(p=>{
      const b=I.find(x=>x!==p&&!usados.has(x.id)&&!String(x.id).startsWith('inc_nom_')&&x.cat==='nomina'
        &&Math.abs((+x.amt||0)-(+p.amt||0))<0.02&&String(x.date).slice(0,7)===String(p.date).slice(0,7)&&Math.abs(D(x.date)-D(p.date))<=6*864e5);
      if(b){usados.add(b.id);out.push({tipo:'nomina',t:'i',quitar:p.id,queda:b.id,nombre:p.desc,nombreQueda:b.desc,date:b.date,amt:+b.amt,desglose:!b.nd&&!!p.nd});}
    });
    const INT=I.filter(x=>/interest|inter[eé]s/i.test(x.desc||''));
    INT.forEach(a=>INT.forEach(b=>{ if(a===b||a.date!==b.date||!((+a.amt)>(+b.amt)))return;
      if(Math.abs(a.amt*0.81-b.amt)<0.03&&!out.some(o=>o.quitar===b.id))out.push({tipo:'interes',t:'i',quitar:b.id,queda:a.id,nombre:b.desc,nombreQueda:a.desc,date:b.date,amt:+b.amt,bruto:+a.amt});}));
    const G=expenseLog.filter(x=>!_esSintetico(x)&&!ce.has(x.id)&&x.src!=='compensacion');
    const porDI={}; G.forEach(x=>{const k=x.date+'|'+Math.round((+x.amt||0)*100);(porDI[k]=porDI[k]||[]).push(x);});
    Object.values(porDI).forEach(L=>{ if(L.length<2)return;
      for(let i=0;i<L.length;i++)for(let j=0;j<L.length;j++){ const a=L[i],b=L[j]; if(i===j||usados.has(a.id)||usados.has(b.id))continue;
        if(String(a.name||'').trim().toLowerCase()===String(b.name||'').trim().toLowerCase())continue;   // dos compras iguales: no se toca
        const ta=tsId(a.id), tb=tsId(b.id); if(ta==null||tb==null||!(tb>ta))continue;              // b entró después
        const pa=pal(a.name), pb=pal(b.name); if(!pb.length||!pb.some(w=>pa.some(v=>v.includes(w)||w.includes(v))))continue;
        usados.add(a.id);usados.add(b.id);
        out.push({tipo:'gasto',t:'g',quitar:b.id,queda:a.id,nombre:b.name,nombreQueda:a.name,date:a.date,amt:+a.amt});
      }});
    return out.sort((x,y)=>String(x.date).localeCompare(String(y.date)));
  };
  P.corregirDuplicados=function(){
    const L=P.duplicados(); let n=0;
    L.forEach(o=>{
      if(o.t==='i'){ const p=incomeLog.find(x=>x.id===o.quitar), b=incomeLog.find(x=>x.id===o.queda); if(!p||!b)return;
        if(o.tipo==='nomina'){ if(!b.nd&&p.nd)b.nd=p.nd; ['noRec','noRecAuto'].forEach(k=>{if(p[k]!=null&&b[k]==null)b[k]=p[k];}); }
        incomeLog=incomeLog.filter(x=>x.id!==p.id); n++; }
      else { const r=expenseLog.find(x=>x.id===o.quitar), k=expenseLog.find(x=>x.id===o.queda); if(!r||!k)return;
        k.alias=k.alias||[]; if(r.name&&!k.alias.includes(r.name))k.alias.push(r.name);
        if(r.pendDev&&!k.pendDev)k.pendDev=r.pendDev; if(r.noRec!=null&&k.noRec==null)k.noRec=r.noRec;
        expenseLog=expenseLog.filter(x=>x.id!==r.id); n++; }
    });
    save(); return n;
  };
})(__LEG.P);

</script>
<script>
// ════════════════════════════════════════════════════════════════════
// v166 · ALMACÉN SIN TOPE: los datos pasan de localStorage a IndexedDB
// ════════════════════════════════════════════════════════════════════
// Safari solo deja 5 MB por web en localStorage. Con tus datos, la copia para
// deshacer y lo que crecen cada mes, ya no cabía, y tarde o temprano no iba a
// caber ni siquiera lo tuyo. IndexedDB es el otro almacén del navegador y no
// tiene ese tope: en el iPad, cada web puede usar hasta un 60 % del disco.
//
// Las dos apps leen y escriben exactamente igual que antes, al instante, sobre
// una copia en memoria: ALM se usa como localStorage. Cada cambio se escribe en
// IndexedDB justo después, y si hay otra pestaña de la app abierta se le pasa,
// para que no siga trabajando con datos viejos.
//
// La mudanza se hace sola la primera vez: se copian los datos, se leen de
// vuelta para comprobar que han llegado enteros y solo entonces se borran de
// localStorage. Allí queda una marca pequeña que dice dónde están ahora.
// Si IndexedDB no funciona y nunca se ha mudado nada, se sigue con
// localStorage como siempre. Si los datos ya están en IndexedDB y no se pueden
// leer, no se arranca vacía: se avisa y no se toca nada.
const ALM=(function(){
  'use strict';
  const BD='disfruta-la-vida', TABLA='claves', MARCA='dlv_almacen';
  const LS=window.localStorage;
  const nuestra=k=>/^dlv_|^dlv2_/.test(k)&&k!==MARCA;
  const mem=new Map();
  let db=null, modo='ls', motivo='', persistente=null;
  let cola=new Map(), programado=false, cadena=Promise.resolve(), avisado=false, reintento=null;
  let canal=null;
  try{ canal=new BroadcastChannel('dlv-almacen'); }catch(e){ canal=null; }

  function abrir(){
    return new Promise((ok,ko)=>{
      let r;
      try{ r=indexedDB.open(BD,1); }catch(e){ ko(e); return; }
      r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains(TABLA))d.createObjectStore(TABLA); };
      r.onsuccess=()=>{
        const d=r.result;
        d.onversionchange=()=>{ try{d.close();}catch(e){} if(db===d)db=null; };
        d.onclose=()=>{ if(db===d)db=null; };
        ok(d);
      };
      r.onerror=()=>ko(r.error||new Error('IndexedDB no se abre'));
      r.onblocked=()=>ko(new Error('IndexedDB está bloqueado por otra pestaña'));
    });
  }
  function leerTodo(d){
    return new Promise((ok,ko)=>{
      const out=new Map();
      let t;
      try{ t=d.transaction(TABLA,'readonly'); }catch(e){ ko(e); return; }
      const c=t.objectStore(TABLA).openCursor();
      c.onsuccess=()=>{ const x=c.result; if(x){ out.set(String(x.key),x.value); x.continue(); } };
      t.oncomplete=()=>ok(out);
      t.onerror=t.onabort=()=>ko(t.error||new Error('No se ha podido leer IndexedDB'));
    });
  }
  function escribir(d,pares,vaciar){
    return new Promise((ok,ko)=>{
      let t;
      try{ t=d.transaction(TABLA,'readwrite'); }catch(e){ ko(e); return; }
      const s=t.objectStore(TABLA);
      if(vaciar)s.clear();
      pares.forEach(([k,v])=>{ if(v==null)s.delete(k); else s.put(v,k); });
      t.oncomplete=()=>ok();
      t.onerror=t.onabort=()=>ko(t.error||new Error('No se ha podido escribir en IndexedDB'));
    });
  }
  function clavesLS(){
    const o=[];
    for(let i=0;i<LS.length;i++){ const k=LS.key(i); if(k!=null&&nuestra(k))o.push(k); }
    return o;
  }
  // La marca va en localStorage, que está lleno: si no cabe, se suelta antes lo
  // más gordo, que para entonces ya está a salvo en IndexedDB.
  function marcar(){
    const v=JSON.stringify({en:'IndexedDB',desde:new Date().toISOString()});
    try{ LS.setItem(MARCA,v); return true; }
    catch(e){
      ['dlv2_undo','dlv2_db','dlv_undo'].forEach(k=>{ try{LS.removeItem(k);}catch(_){} });
      try{ LS.setItem(MARCA,v); return true; }catch(e2){ return false; }
    }
  }
  async function iniciar(){
    if(!window.indexedDB){ motivo='este navegador no tiene IndexedDB'; return; }
    const yaMudado=!!LS.getItem(MARCA);
    let d, guardado;
    try{ d=await abrir(); guardado=await leerTodo(d); }
    catch(e){
      motivo=String(e&&e.message||e);
      if(yaMudado)modo='roto';     // tus datos están allí y ahora no se pueden leer: no se arranca vacía
      return;
    }
    try{
      const enLS=clavesLS();
      // Antes de la marca, manda localStorage. Con la marca puesta, manda
      // IndexedDB, salvo que esté vacío y en localStorage haya datos.
      if(!yaMudado||(!guardado.size&&enLS.includes('dlv_cfg'))){
        if(enLS.length){
          const pares=enLS.map(k=>[k,LS.getItem(k)]);
          await escribir(d,pares,true);
          const vuelta=await leerTodo(d);
          const enteros=vuelta.size===pares.length&&pares.every(([k,v])=>vuelta.get(k)===v);
          if(!enteros)throw new Error('la copia en IndexedDB no ha llegado entera');
          guardado=vuelta;
          if(!marcar())throw new Error('no se ha podido dejar la marca de la mudanza');
          enLS.forEach(k=>{ try{LS.removeItem(k);}catch(e){} });
        }else if(!marcar())throw new Error('no se ha podido dejar la marca de la mudanza');
      }
    }catch(e){
      motivo=String(e&&e.message||e);
      try{ d.close(); }catch(_){}
      if(LS.getItem(MARCA))modo='roto';
      return;     // sin marca, todo sigue en localStorage, como antes
    }
    guardado.forEach((v,k)=>mem.set(k,v));
    db=d; modo='idb';
    // Que el iPad no lo borre si se queda sin espacio. Safari decide solo,
    // y suele concederlo a las apps de la pantalla de inicio.
    try{
      if(navigator.storage&&navigator.storage.persist){
        navigator.storage.persisted()
          .then(p=>p||navigator.storage.persist())
          .then(p=>{persistente=!!p;},()=>{});
      }
    }catch(e){}
  }

  function avisar(e){
    if(avisado)return;
    avisado=true;
    setTimeout(()=>alert('No se están guardando los cambios en este navegador ('+(e&&e.message||e)+').\n\n'+
      'Guarda ahora una copia en archivo y vuelve a abrir la app.'),50);
  }
  function programar(){
    if(programado)return;
    programado=true;
    Promise.resolve().then(volcar);
  }
  function volcar(){
    programado=false;
    if(!cola.size)return;
    const lote=[...cola.entries()];
    cola=new Map();
    cadena=cadena.then(async()=>{
      try{
        if(!db)db=await abrir();
        await escribir(db,lote,false);
      }catch(e){
        try{ db=await abrir(); await escribir(db,lote,false); }
        catch(e2){
          // se reintenta; si mientras tanto has cambiado esa clave, manda lo nuevo
          lote.forEach(([k,v])=>{ if(!cola.has(k))cola.set(k,v); });
          avisar(e2);
          clearTimeout(reintento); reintento=setTimeout(programar,5000);
          return;
        }
      }
      avisado=false;
      if(canal)try{ canal.postMessage(lote); }catch(e){}
    });
  }
  // Lo que escribe otra pestaña de la app llega aquí
  if(canal)canal.onmessage=ev=>{
    const lote=ev.data;
    if(modo!=='idb'||!Array.isArray(lote))return;
    lote.forEach(([k,v])=>{
      if(cola.has(k))return;       // lo tuyo pendiente de escribir manda
      if(v==null)mem.delete(k); else mem.set(k,v);
    });
  };
  // Al irse la app a segundo plano, que no quede nada a medias
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&cola.size)volcar(); });

  function claves(){
    if(modo==='idb')return [...mem.keys()];
    const o=[];
    for(let i=0;i<LS.length;i++){ const k=LS.key(i); if(k!==MARCA)o.push(k); }
    return o;
  }
  const listo=iniciar().catch(e=>{ motivo=String(e&&e.message||e); });
  return {
    getItem(k){
      k=String(k);
      if(modo==='idb'&&nuestra(k))return mem.has(k)?mem.get(k):null;
      return LS.getItem(k);
    },
    setItem(k,v){
      k=String(k); v=String(v);
      if(modo==='idb'&&nuestra(k)){ mem.set(k,v); cola.set(k,v); programar(); return; }
      if(modo==='roto')throw new Error('Tus datos no se pueden abrir ahora');
      LS.setItem(k,v);
    },
    removeItem(k){
      k=String(k);
      if(modo==='idb'&&nuestra(k)){ mem.delete(k); cola.set(k,null); programar(); return; }
      if(modo==='roto')return;
      LS.removeItem(k);
    },
    key(i){ const c=claves(); return i>=0&&i<c.length?c[i]:null; },
    get length(){ return claves().length; },
    get listo(){ return listo; },
    get modo(){ return modo; },          // 'idb', 'ls' o 'roto'
    get motivo(){ return motivo; },
    get persistente(){ return persistente; },
    // caracteres guardados, para el panel de revisión
    tamano(){ let t=0; claves().forEach(k=>{ const v=this.getItem(k); t+=k.length+(v?v.length:0); }); return t; },
    // se resuelve cuando todo lo escrito hasta ahora está ya en IndexedDB
    escrito(){ if(cola.size)volcar(); return cadena; }
  };
})();
// Si los datos ya están en IndexedDB y no se pueden leer, se dice y no se arranca
function almacenRoto(){
  const d=document.createElement('div');
  d.setAttribute('role','alert');
  d.style.cssText='position:fixed;inset:0;z-index:99999;background:#fff;color:#1a2433;padding:28px 22px;'+
    'font:16px/1.55 -apple-system,system-ui,sans-serif;overflow:auto';
  d.innerHTML='<h2 style="font-size:20px;margin:0 0 12px">No se pueden abrir tus datos ahora mismo</h2>'+
    '<p>Están guardados en este iPad, pero el navegador no deja leerlos en este momento. No se ha borrado nada.</p>'+
    '<p>Cierra la app del todo (desde el selector de apps, deslizándola hacia arriba) y vuelve a abrirla. '+
    'Si sigue igual, reinicia el iPad.</p>'+
    '<p style="color:#5a6575;font-size:13px">Detalle: '+String(ALM.motivo||'').replace(/[<>&]/g,'')+'</p>';
  document.body.appendChild(d);
}

<script>
// ════════════════════════════════════════════════════════════════════
// v169 · EL MOTOR VIENE DE motor.js
// ════════════════════════════════════════════════════════════════════
// Las dos apps usan el mismo motor.js. Si falta, o si es de otra versión que

const MOTOR_ESPERADO='v169';

    '<p><button type="button" onclick="location.reload()" style="font:inherit;padding:10px 16px;border-radius:10px;border:1px solid #c9d2de;background:#f3f6fa">Volver a intentarlo</button></p>';
  (document.body||document.documentElement).appendChild(d);

function motorComprobar(v){
  if(v===MOTOR_ESPERADO){ try{ sessionStorage.removeItem('dlv_motor_recarga'); }catch(e){} return true; }
  // la primera vez, se recarga: casi siempre es una copia vieja guardada en el navegador
  let ya=true;

  if(!ya){ location.reload(); return false; }
  motorFallo('La app y su motor no son de la misma versión',
    'Esta página es la '+MOTOR_ESPERADO+' y el motor (motor.js) es la '+(v||'anterior a la v169')+'. '+
    'Sube a la vez los cuatro archivos: index.html, nueva.html, motor.js y sw.js.');

// v169 · SIN CONEXIÓN. sw.js guarda una copia de la app (las dos páginas,
// motor.js y el icono) y del lector de PDF. Con conexión manda siempre lo del
// servidor; la copia solo se usa si no hay red.
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e)); });

// v169 · Un nombre para cada campo que no lo tiene: VoiceOver los leía como
// «campo de texto» a secas. Sale de su etiqueta, de lo que tiene al lado, del
// texto de ayuda o de la cabecera de su columna. Se repite solo cada vez que
// cambia la pantalla.
(function(){
  const sinMi=(lab,el)=>[...lab.childNodes].filter(n=>n!==el&&!(n.contains&&n.contains(el))&&!(n.querySelector&&n.querySelector('select,input,textarea')))
    .map(n=>n.textContent).join(' ').replace(/\s+/g,' ').trim();
  const CTL=/^(SELECT|INPUT|TEXTAREA|BUTTON)$/;
  // el texto más cercano por delante, saltando otros campos («Desde [mes] [año]»)
  function antes(el){
    let n=el.previousSibling, k=0;
    while(n&&k<8){
      if(n.nodeType===3&&n.textContent.trim())return n.textContent;
      if(n.nodeType===1&&!CTL.test(n.tagName)&&n.textContent.trim()&&!n.querySelector('input,select,textarea'))return n.textContent;
      n=n.previousSibling; k++;
    }
    return '';
  }
  function clase(el){
    if(el.tagName!=='SELECT')return '';
    const o=[...el.options].map(x=>x.text.trim());
    if(o.some(x=>/^(ene|enero|feb|febrero)$/i.test(x)))return ' (mes)';
    if(o.filter(x=>/^\d{4}$/.test(x)).length>2)return ' (año)';
    return '';
  }
  const varios=el=>{ const l=(el.labels||[])[0]; return !!(l&&l.querySelectorAll('input,select,textarea').length>1); };
  function cerca(el){
    if(!varios(el))for(const l of (el.labels||[])){ const x=sinMi(l,el); if(x)return x; }
    const a=antes(el); if(a)return a+clase(el);
    const td=el.closest('td');
    if(td){ const tr=td.parentElement, i=[...tr.children].indexOf(td), tb=td.closest('table'), th=tb&&tb.querySelector('thead tr');
      const c=th&&th.children[i]?th.children[i].textContent.trim():'', f=tr.firstElementChild&&tr.firstElementChild!==td?tr.firstElementChild.textContent.trim():'';
      if(c||f)return [c,f].filter(Boolean).join(' · '); }
    for(const l of (el.labels||[])){ const x=sinMi(l,el); if(x)return x+clase(el); }
    return el.getAttribute('placeholder')||el.getAttribute('title')||(el.tagName==='SELECT'&&el.options.length?el.options[0].text:'');
  }
  function nombrar(){
    document.querySelectorAll('input:not([type=hidden]):not([aria-label]):not([aria-labelledby]),select:not([aria-label]):not([aria-labelledby]),textarea:not([aria-label])').forEach(el=>{
      let ok=false; if(!varios(el))for(const l of (el.labels||[])){ if(sinMi(l,el)){ok=true;break;} }
      if(ok)return;
      const x=String(cerca(el)||'').replace(/\s+/g,' ').trim().slice(0,90);
      if(x)el.setAttribute('aria-label',x);
    });
  }
  let pend=0;
  const mo=new MutationObserver(()=>{ if(pend)return; pend=setTimeout(()=>{pend=0;nombrar();},120); });
  const ir=()=>{ nombrar(); mo.observe(document.body,{childList:true,subtree:true}); };
  if(document.body)ir(); else document.addEventListener('DOMContentLoaded',ir);
})();
</script>
<script>

// ════════════════════════════════════════════════════════════════════
// DISFRUTA LA VIDA · v2 · MOTOR
// ════════════════════════════════════════════════════════════════════
// Tres almacenes y nada más:
//   mov  · el libro: cada euro que se mueve es UN apunte
//   val  · saldos y valoraciones, cada uno con su fecha, su fuente y su bróker
//   sit  · tu situación: los supuestos, en un solo sitio
// Todo lo demás —patrimonio, ahorro, rentabilidad, impuestos— se CALCULA a
// partir de ahí, siempre con la misma función. Nada se guarda dos veces, así
// que no hay dos cifras que puedan contradecirse.
//
// La app actual (dlv_*) no se toca nunca: se lee para migrar y ya está.
'use strict';
const V2_KEY='dlv2_db';
const isoL=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');   // v169 · fecha local, sin UTC
const HOY=()=>isoL(new Date());
const finMes=(y,m)=>{const d=new Date(y,m,0);return y+'-'+String(m).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const r2=v=>Math.round((Number(v)||0)*100)/100;

// ─── Migración ─────────────────────────────────────────────────────
// Entra lo mismo venga de donde venga: el almacenamiento de la app actual
// (mismo navegador, mismo dominio) o una copia JSON exportada desde ella.
function leerAppActual(ls){
  const g=k=>{try{const r=ls.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}};
  const cfg=g('dlv_cfg'); if(!cfg)return null;
  return {cfg,records:g('dlv_records')||[],transactions:g('dlv_tx')||[],soldStocks:g('dlv_sold')||[],
    balanceLog:g('dlv_ballog')||[],incomeLog:g('dlv_income')||[],expenseLog:g('dlv_expense')||[],
    brokerFlows:g('dlv_brokerflows')||[],reembolsos:g('dlv_reembolsos')||[],personal:g('dlv_personal')||{}};
}
function migrar(old,origen){
  const c=old.cfg||{};
  const db={v:2,creado:new Date().toISOString(),origen:origen||'app actual',
    cuentas:[],activos:[],mov:[],val:[],cierres:[],compensaciones:[],sit:{},reglas:{},legado:{}};
  (c.accounts||[]).forEach(a=>db.cuentas.push({id:a.id,nombre:a.name,
    tipo:/efectivo|casa|met[aá]lico/i.test(a.name||'')?'efectivo':'banco'}));
  (c.brokers||[]).forEach(b=>db.cuentas.push({id:b.id,nombre:b.name,tipo:'broker'}));
  (c.debts||[]).forEach(d=>db.cuentas.push({id:d.id,nombre:d.name,tipo:'deuda'}));
  const vendidas=new Set(old.soldStocks||[]);
  (c.funds||[]).forEach(f=>db.activos.push({id:f.id,nombre:f.name,tipo:'fondo',isin:f.isin||null}));
  (c.stocks||[]).forEach(s=>db.activos.push({id:s.id,nombre:s.name,tipo:'accion',
    isin:s.isin||null,tick:s.tick||null,cerrada:vendidas.has(s.id)}));
  // el libro
  (old.incomeLog||[]).forEach(e=>db.mov.push({id:e.id,fecha:e.date,tipo:'ingreso',importe:r2(e.amt),
    cat:e.cat,desc:e.desc,nd:e.nd||undefined,stock:e.stockId||undefined}));
  (old.expenseLog||[]).forEach(e=>db.mov.push({id:e.id,fecha:e.date,tipo:'gasto',importe:r2(e.amt),
    cat:e.cat,desc:e.name,clase:e.kind,fijoId:e.fijoId||undefined}));
  (old.transactions||[]).forEach(t=>{
    if(t.type==='fund_aport')db.mov.push({id:t.id,fecha:t.date,tipo:'aportacion',importe:r2(t.amount),activo:t.fundId});
    else if(t.type==='buy'||t.type==='sell')db.mov.push({id:t.id,fecha:t.date,tipo:t.type==='buy'?'compra':'venta',
      activo:t.stockId,titulos:Number(t.shares)||0,precio:Number(t.price)||0,costes:r2(t.costs),
      importe:r2(t.total),fuente:t.src||undefined,ext:t.ext||t.orden||undefined,mktval:t.mktval||undefined,
      motivo:t.exitReason||undefined});
  });
  (old.brokerFlows||[]).forEach(f=>db.mov.push({id:f.id,fecha:f.date,tipo:f.type==='retira'?'de_broker':'a_broker',
    importe:r2(f.amount),cuenta:f.brokerId,ext:f.ext||undefined}));
  // saldos y valoraciones
  const refT={acc:'cuenta',broker:'cuenta',debt:'cuenta',fund:'activo',stock:'activo'};
  (old.balanceLog||[]).forEach(b=>{ if(!refT[b.refType])return;
    db.val.push({id:b.id,fecha:b.date,refTipo:refT[b.refType],ref:b.refId,importe:r2(b.amount),
      fuente:b.src||undefined,brk:b.brk||undefined}); });
  // histórico mensual: lo único que hay de 2015 a enero de 2026 son totales
  (old.records||[]).forEach(r=>db.cierres.push({ym:r.year+'-'+String(r.month).padStart(2,'0'),
    pat:r2(r.pat),cash:r2(r.cash),fondos:r2(r.fondos),acc:r2(r.acc),deuda:r2(r.deuda)}));
  db.cierres.sort((a,b)=>a.ym.localeCompare(b.ym));
  db.compensaciones=(old.reembolsos||[]).slice();
  db.sit={pension:c.pension||{},puestos:c.puestosCfg||null,bienes:c.bienes||null,fiscal:c.fiscal||null,titular:c.titular||null,
    gastosFijos:c.gastos_fijos||[],projAporte:c.projAporte||null};
  db.reglas={catRules:c.catRules||[],customCats:c.customCats||{},recatIgnored:c.recatIgnored||[]};
  // lo que se portará en fases siguientes, intacto
  db.legado={personal:old.personal||{}};
  db.mov.sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')));
  return db;
}

// ─── Consultas básicas ─────────────────────────────────────────────
function valDe(db,ref,hasta){
  return db.val.filter(v=>v.ref===ref&&(!hasta||String(v.fecha)<=hasta))
    .sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
}
function saldo(db,ref,hasta){ const e=valDe(db,ref,hasta); return e.length?e[0].importe:null; }
// Una acción puede estar en varios brókers: su valor es la suma de la última
// valoración de cada uno. Un apunte viejo sin bróker deja de contar en cuanto
// hay uno con bróker de esa fecha o posterior; uno escrito a mano, si es el
// más reciente, manda como total.
const SRC_IMPORT=/^(degiro|xtb|portfolio)$/i;
function valorAccion(db,id,hasta){
  const e=valDe(db,id,hasta);
  if(!e.length)return {total:null,partes:[],fecha:null};
  const g={}; e.forEach(x=>{const k=x.brk||'';if(!g[k])g[k]=x;});
  const conBrk=Object.keys(g).filter(k=>k);
  let suelta=g[''];
  if(!conBrk.length)return {total:suelta.importe,partes:[{brk:'',importe:suelta.importe,fecha:suelta.fecha}],fecha:suelta.fecha};
  const masNueva=conBrk.reduce((d,k)=>g[k].fecha>d?g[k].fecha:d,'');
  const heredado=suelta&&SRC_IMPORT.test(String(suelta.fuente||''));
  if(heredado&&suelta.fecha<=masNueva)suelta=null;
  if(suelta&&suelta.fecha>=masNueva)
    return {total:suelta.importe,partes:[{brk:'',importe:suelta.importe,fecha:suelta.fecha,manual:true}],fecha:suelta.fecha};
  const partes=conBrk.map(k=>({brk:k,importe:g[k].importe,fecha:g[k].fecha}));
  return {total:r2(partes.reduce((s,p)=>s+p.importe,0)),partes,fecha:masNueva};
}
function titulosEn(db,id,hasta){
  return db.mov.reduce((s,m)=>{
    if(m.activo!==id||(hasta&&String(m.fecha)>hasta))return s;
    if(m.tipo==='compra')return s+(m.titulos||0);
    if(m.tipo==='venta')return s-(m.titulos||0);
    return s;
  },0);
}
function accionAbierta(db,a,hasta,esHoy){
  const compradas=db.mov.some(m=>m.activo===a.id&&m.tipo==='compra'&&(!hasta||String(m.fecha)<=hasta));
  const vivas=titulosEn(db,a.id,hasta);
  if(esHoy&&a.cerrada)return false;
  return !(compradas&&vivas<=1e-6);
}

// ─── Patrimonio en una fecha ───────────────────────────────────────
// Una sola función. La cabecera, el gráfico y cualquier pantalla futura
// llaman a esta; por eso no pueden no cuadrar.
function patrimonio(db,fecha){
  const hoy=HOY(), f=fecha||hoy, esHoy=(f>=hoy);
  const out={fecha:f,cash:0,fondos:0,acciones:0,broker:0,deuda:0,detalle:{cuentas:[],fondos:[],acciones:[],brokers:[],deudas:[]}};
  db.cuentas.forEach(c=>{
    const v=saldo(db,c.id,f); if(v==null)return;
    if(c.tipo==='broker'){out.broker+=v;out.detalle.brokers.push({id:c.id,nombre:c.nombre,importe:v});}
    else if(c.tipo==='deuda'){out.deuda+=v;out.detalle.deudas.push({id:c.id,nombre:c.nombre,importe:v});}
    else {out.cash+=v;out.detalle.cuentas.push({id:c.id,nombre:c.nombre,importe:v});}
  });
  db.activos.forEach(a=>{
    if(a.tipo==='fondo'){
      const v=saldo(db,a.id,f); if(!v)return;
      out.fondos+=v; out.detalle.fondos.push({id:a.id,nombre:a.nombre,importe:v});
    } else {
      if(!accionAbierta(db,a,esHoy?null:f,esHoy))return;
      let V=valorAccion(db,a.id,esHoy?null:f);
      let v=V.total;
      if(v==null){   // sin valoración: la última compra con valor de mercado, como hacía la app
        const c=db.mov.filter(m=>m.activo===a.id&&m.tipo==='compra'&&m.mktval>0&&(esHoy||String(m.fecha)<=f))
          .sort((x,y)=>String(y.fecha).localeCompare(String(x.fecha)))[0];
        v=c?c.mktval:0;
      }
      if(v>0){out.acciones+=v;out.detalle.acciones.push({id:a.id,nombre:a.nombre,importe:v,partes:V.partes,fecha:V.fecha});}
    }
  });
  ['cash','fondos','acciones','broker','deuda'].forEach(k=>out[k]=r2(out[k]));
  out.financiero=r2(out.cash+out.fondos+out.acciones+out.broker-out.deuda);
  return out;
}
// ¿Hay datos de todo lo que tenías en esa fecha? Si una cuenta que ya existía
// todavía no tiene ningún saldo guardado, el patrimonio de ese mes saldría
// cojo: el gráfico enseñaría una caída que nunca ocurrió. Entonces ese mes se
// deja en blanco y se dice por qué, en vez de pintar un número falso.
function cobertura(db,f){
  const falta=[];
  const primera=ref=>{const e=db.val.filter(v=>v.ref===ref).map(v=>v.fecha).sort();return e[0]||null;};
  db.cuentas.forEach(c=>{
    const p=primera(c.id); if(!p)return;
    if(c.tipo==='banco'||c.tipo==='efectivo'){ if(p>f)falta.push(c.nombre); }
    else if(c.tipo==='broker'){
      const vivo=db.mov.some(m=>m.cuenta===c.id&&m.tipo==='a_broker'&&String(m.fecha)<=f);
      if(vivo&&p>f)falta.push(c.nombre);
    }
  });
  db.activos.forEach(a=>{
    const p=primera(a.id);
    if(a.tipo==='fondo'){
      const vivo=db.mov.some(m=>m.activo===a.id&&m.tipo==='aportacion'&&String(m.fecha)<=f);
      if(vivo&&(!p||p>f))falta.push(a.nombre);
    } else if(titulosEn(db,a.id,f)>1e-6){
      const mk=db.mov.some(m=>m.activo===a.id&&m.tipo==='compra'&&m.mktval>0&&String(m.fecha)<=f);
      if((!p||p>f)&&!mk)falta.push(a.nombre);
    }
  });
  return falta;
}
// Serie mensual: el histórico importado hasta donde llega y, desde ahí, calculado
function seriePatrimonio(db){
  const S=db.cierres.map(c=>({ym:c.ym,pat:c.pat,origen:'cierre'}));
  const ult=S.length?S[S.length-1].ym:null;
  const hoy=HOY(), [hy,hm]=[+hoy.slice(0,4),+hoy.slice(5,7)];
  let y,m;
  if(ult){y=+ult.slice(0,4);m=+ult.slice(5,7)+1;if(m>12){m=1;y++;}}
  else{const f=db.val.map(v=>v.fecha).sort()[0]; if(!f)return S; y=+f.slice(0,4);m=+f.slice(5,7);}
  while(y<hy||(y===hy&&m<=hm)){
    const esActual=(y===hy&&m===hm), f=esActual?hoy:finMes(y,m);
    const falta=esActual?[]:cobertura(db,f);
    if(falta.length) S.push({ym:y+'-'+String(m).padStart(2,'0'),pat:null,origen:'sin datos',falta});
    else S.push({ym:y+'-'+String(m).padStart(2,'0'),pat:patrimonio(db,f).financiero,origen:esActual?'hoy':'calculado'});
    m++; if(m>12){m=1;y++;}
  }
  return S;
}

// ─── Bienes (vivienda y coche) ─────────────────────────────────────
function bienes(db){
  const b=(db.sit&&db.sit.bienes)||{}, v=b.viv||{}, c=b.veh||{};
  const viv=Math.max(0,(Number(v.valor)||0)*(Number(v.pct)||0)/100-(Number(v.pendiente)||0));
  const veh=Math.max(0,Number(c.valor)||0);
  return {viv:r2(viv),veh:r2(veh),total:r2(viv+veh)};
}

// ─── Pendientes: lo que la app ve que falta, para que no tengas que buscarlo ──
function pendientes(db){
  const P=[], hoy=HOY(), dias=f=>Math.round((Date.parse(hoy)-Date.parse(f))/864e5);
  // saldos que se están quedando viejos
  db.cuentas.filter(c=>c.tipo!=='deuda').forEach(c=>{
    const e=valDe(db,c.id)[0]; if(!e)return;
    const d=dias(e.fecha);
    if(d>14)P.push({tipo:'saldo',grave:d>35,texto:c.nombre+': el último saldo es de hace '+d+' días',
      accion:c.tipo==='efectivo'?'Apunta lo que tienes':(c.tipo==='broker'?'Importa la cartera':'Sube el extracto'),
      ir:'buzon',ancla:c.tipo==='efectivo'?'bz-mano':'zona',mano:c.tipo==='efectivo'?{que:'saldo',ref:c.id}:null});
  });
  // v169 · fondos sin valorar desde hace más de un mes
  db.activos.filter(a=>a.tipo==='fondo').forEach(a=>{
    const e=valDe(db,a.id)[0]; if(!e||!(e.importe>0))return;
    const d=dias(e.fecha);
    if(d>30)P.push({tipo:'fondo',grave:d>60,texto:a.nombre+': la última valoración es de hace '+d+' días',
      accion:'Apunta su valor liquidativo o echa al Buzón su histórico',ir:'buzon',ancla:'bz-mano',mano:{que:'fondo',ref:a.id}});
  });
  // v169 · la última copia de seguridad hecha en este aparato
  let uc=null; try{ uc=(typeof ALM!=='undefined')?ALM.getItem('dlv_lastexport'):null; }catch(e){}
  const du=uc?dias(String(uc).slice(0,10)):null;
  if(du==null||du>30)P.push({tipo:'copia',grave:du==null||du>60,
    texto:du==null?'No consta ninguna copia de seguridad hecha desde este aparato':'Tu última copia de seguridad es de hace '+du+' días',
    accion:'Guarda una copia',ir:'buzon',ancla:'bz-copia-h'});
  // v169 · sin tu nombre no se reconocen las transferencias a ti mismo
  const TI=db.sit&&db.sit.titular;
  if(!TI||(!TI.nombre&&!(TI.propios||[]).length))P.push({tipo:'titular',grave:true,
    texto:'La app no sabe cómo te llamas: las transferencias entre tus cuentas pueden entrar como ingresos o gastos',
    accion:'Echa al Buzón tu archivo de ajustes, o rellena «Tu nombre y tus reglas»',ir:'buzon',ancla:'bz-titular'});
  // una acción con compras en dos brókers pero valorada solo en uno
  db.activos.filter(a=>a.tipo==='accion'&&!a.cerrada).forEach(a=>{
    const fuentes=new Set(db.mov.filter(m=>m.activo===a.id&&m.tipo==='compra')
      .map(m=>/xtb/i.test(m.fuente||'')?'xtb':'degiro'));
    const V=valorAccion(db,a.id);
    if(fuentes.size>1&&V.partes.length<2&&titulosEn(db,a.id)>0)
      P.push({tipo:'broker',grave:true,texto:a.nombre+' la tienes en dos brókers pero solo está valorada en uno',accion:'Importa las dos carteras',ir:'buzon',ancla:'zona'});
  });
  // dividendos que no se sabe de qué acción son
  const acc=db.activos.filter(a=>a.tipo==='accion');
  const norm=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,'').replace(/\s+/g,' ').trim();
  const sinDueno=db.mov.filter(m=>m.tipo==='ingreso'&&m.cat==='dividendo'&&!m.stock&&
    !acc.some(a=>{const n=norm(a.nombre);return n.length>=4&&norm(m.desc).includes(n.split(' ')[0]);}));
  if(sinDueno.length)P.push({tipo:'dividendo',grave:false,texto:sinDueno.length+' dividendo(s) sin saber de qué acción son',accion:'Asígnalos en Movimientos',ir:'flujo',ancla:'fl-movs'});
  // pagos de productividad que la nómina no distingue
  const nd=db.mov.filter(m=>m.tipo==='ingreso'&&m.nd&&m.nd.devengos);
  const vistos=new Set(); let sinDist=0;
  nd.forEach(m=>{
    const k=String(m.fecha).slice(0,7)+'|'+Math.round((m.nd.total_dev||0)*100);
    if(vistos.has(k))return; vistos.add(k);
    m.nd.devengos.forEach(d=>{ if(/^productividad$/i.test(String(d.name||'').trim()))sinDist++; });
  });
  if(sinDist)P.push({tipo:'nomina',grave:false,texto:sinDist+' pago(s) de productividad sin saber si son objetivos o remanente',accion:'Clasifícalos en Tu sueldo',ir:'sueldo'});
  // tablas de retribuciones del año pasado
  if(+hoy.slice(0,4)>2026)P.push({tipo:'tablas',grave:true,texto:'Las tablas de sueldos son de 2026',accion:'Cámbialas en Tu sueldo',ir:'sueldo',ancla:'su-tablas'});
  return P.sort((a,b)=>(b.grave?1:0)-(a.grave?1:0));
}
// Cuándo llegó el último dato de cada fuente
function frescura(db){
  const F={};
  db.val.forEach(v=>{
    const c=db.cuentas.find(x=>x.id===v.ref);
    let k=null;
    if(c&&c.tipo!=='deuda')k=c.nombre;
    else if(v.brk){const b=db.cuentas.find(x=>x.id===v.brk);k=b?b.nombre+' (cartera)':null;}
    else { const a=db.activos.find(x=>x.id===v.ref); if(a&&a.tipo==='fondo')k=a.nombre; }   // v169 · y los fondos
    if(k&&(!F[k]||v.fecha>F[k]))F[k]=v.fecha;
  });
  return Object.entries(F).map(([k,f])=>({fuente:k,fecha:f})).sort((a,b)=>b.fecha.localeCompare(a.fecha));
}

if(typeof module!=='undefined'&&module.exports)module.exports={leerAppActual,migrar,patrimonio,seriePatrimonio,cobertura,valorAccion,
  bienes,pendientes,frescura,saldo,titulosEn,HOY,finMes,V2_KEY};


// ════════════════════════════════════════════════════════════════════
// v2 · INTERFAZ
// ════════════════════════════════════════════════════════════════════
'use strict';
let DB=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Siempre con separador de miles: en español «Y» y «X» en la
// misma pantalla parecen dos formatos distintos.
function eur(v,dec){
  const d=dec==null?2:dec, n=Number(v)||0, neg=n<0;
  const [ent,fr]=Math.abs(n).toFixed(d).split('.');
  return (neg?'−':'')+ent.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(d?','+fr:'')+'\u00a0€';   // v169 · que no se parta
}
const miles=v=>String(Math.round(Number(v)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
function fecha(iso){ if(!iso)return '—'; const [y,m,d]=String(iso).slice(0,10).split('-'); return d?(+d+'/'+(+m)+'/'+y.slice(2)):iso; }
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mesLargo=ym=>MESES[+ym.slice(5,7)-1]+' de '+ym.slice(0,4);

const PANTALLAS=[
  ['hoy','Hoy',true],['flujo','Entra y sale',true],['inv','Inversiones',true],['sueldo','Tu sueldo',true],
  ['imp','Impuestos',true],['futuro','Futuro',true],['decis','Decisiones',true],['buzon','Buzón',true]];
let actual='hoy';
function nav(){
  $('#nav').innerHTML=PANTALLAS.map(([id,t,hecha])=>
    '<button type="button" data-p="'+id+'" class="'+(hecha?'':'luego')+'"'+(id===actual?' aria-current="page"':'')+'>'+t+'</button>').join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>ir(b.dataset.p));
}
function ir(p){ actual=p; nav(); pintar(); window.scrollTo(0,0); }
const PINTORES={};   // id → [pintar, enlazar], los rellena cada pantalla
function pintar(){
  const m=$('#main');
  if(!DB&&actual!=='buzon'){ m.innerHTML=sinDatos(); enlazarBuzon(); return; }
  if(actual==='hoy')m.innerHTML=hoy();
  else if(actual==='buzon'){ m.innerHTML=buzon(); enlazarBuzon(); }
  else if(PINTORES[actual]){
    let html;
    try{ html=PINTORES[actual][0](); }
    catch(e){ console.error(e); html='<h1 class="t1">'+PANTALLAS.find(x=>x[0]===actual)[1]+'</h1><div class="aviso mal">Esta pantalla ha fallado al calcularse: '+esc(e.message||e)+'. La app de siempre sigue teniendo todo.</div>'; }
    m.innerHTML=html;
    try{ PINTORES[actual][1](); }catch(e){ console.error(e); }
  }
  else m.innerHTML=todavia(actual);
  enlazarHoy(); enlazarComun();
}

    'Si la app de siempre está abierta en este mismo navegador, lo trae sola. Si no, carga tu última copia.</p>'+

function todavia(id){

    '<p class="pie" style="font-size:15px">Esta pantalla todavía no está hecha en la versión nueva. '+

        '</td><td class="num">'+eur(x.importe)+'</td></tr>').join('')+'</table></div>';
    }

  // pendientes
  const PE=pendientes(DB);
  if(LEG.P){ const RC=Q('recat|false',P=>P.recat(false)); if(RC&&RC.n)PE.push({tipo:'recat',grave:false,texto:RC.n+' gastos sin clasificar, en «Otro»',accion:'Clasifícalos en Entra y sale',ir:'flujo',ancla:'fl-recat'});
    const RV=Q('revision',P=>P.revision()); if(RV&&RV.repetidos&&RV.repetidos.length){ const ri=RV.repetidos.filter(x=>x.t==='i').reduce((t,x)=>t+x.amt,0);

    const CS=Q('cobsin',P=>P.cobradosSinCompensar())||[]; CS.forEach(x=>PE.push({tipo:'comp',grave:true,texto:x.name+' ('+eur(x.amt)+') ya te lo devolvieron, pero el pago y la devolución cuentan los dos',accion:'Compénsalos en Entra y sale',ir:'flujo',ancla:'fl-comp'}));
    // v169 · las escalas del IRPF y los impuestos de la vivienda, cada año
    const TF=Q('tablasF',P=>P.tablasFiscales());

// Área mensual en SVG: los huecos se ven como huecos
function grafico(S){
  const W=640,H=200,pl=8,pr=8,pt=10,pb=22;
  const vals=S.map(x=>x.pat).filter(v=>v!=null);
  if(!vals.length)return '<div class="vacio">Sin datos todavía.</div>';
  const max=Math.max(...vals)*1.06, n=S.length;
  const X=i=>pl+(W-pl-pr)*(n<=1?0:i/(n-1)), Y=v=>pt+(H-pt-pb)*(1-v/max);
  let tramos=[],cur=[];
  S.forEach((x,i)=>{ if(x.pat==null){if(cur.length)tramos.push(cur);cur=[];} else cur.push([X(i),Y(x.pat)]); });
  if(cur.length)tramos.push(cur);
  let s='<svg class="grafico" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Patrimonio mes a mes">';
  // huecos
  let i=0; while(i<n){ if(S[i].pat==null){let j=i;while(j<n&&S[j].pat==null)j++;
      s+='<rect class="hueco" x="'+X(i-0.5)+'" y="'+pt+'" width="'+(X(j-0.5)-X(i-0.5))+'" height="'+(H-pt-pb)+'"/>';i=j;} else i++; }
  tramos.forEach(t=>{
    const d=t.map((p,k)=>(k?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    s+='<path class="area" d="'+d+' L'+t[t.length-1][0].toFixed(1)+' '+(H-pb)+' L'+t[0][0].toFixed(1)+' '+(H-pb)+' Z"/>';
    s+='<path class="trazo" d="'+d+'"/>';
  });
  const ult=S.length-1; if(S[ult].pat!=null)s+='<circle class="punto" cx="'+X(ult)+'" cy="'+Y(S[ult].pat)+'" r="3.5"/>';
  // años en el eje
  S.forEach((x,k)=>{ if(x.ym.slice(5)==='01'&&(+x.ym.slice(0,4))%2===0)
    s+='<text class="eje" x="'+X(k)+'" y="'+(H-6)+'" text-anchor="middle">'+x.ym.slice(0,4)+'</text>'; });
  s+='</svg>';
  return s;
}

function traerDe(old,origen){
  if(!old||!old.cfg){aviso('Ese archivo no es una copia de la app: no tiene la configuración dentro.',false);return;}
  if(DB&&!confirm('Esto sustituye lo que hay en esta versión por lo que traigas ahora. ¿Seguir?'))return;
  DB=migrar(old,origen);
  if(guardar()){
    const P=patrimonio(DB);
    aviso('Traído: '+miles(DB.mov.length)+' apuntes y '+miles(DB.val.length)+' valoraciones. Patrimonio de hoy: '+eur(P.financiero)+'.',true);
    setTimeout(()=>ir('hoy'),900);
  }
}

function aplicable(it){
  if(it.tipo==='historico')return !it.error&&!!it.nav;   // v169 · el histórico se guarda aunque la valoración no cambie
  if(it.error||!it.dif)return false;
  if(it.tipo==='copia'||it.tipo==='copia2'||it.tipo==='desconocido')return false;
  const d=it.dif;
  return d.ingresos.length||d.gastos.length||d.saldos.length||d.saldosCambiados.length||d.ops.length||d.flujos.length||d.acciones.length||d.nominas;
}
const contar=(txt,re)=>{const m=String(txt||'').match(re);return m?+m[1]:0;};
function tarjeta(it){
  const t=describir(it);
  let h='<div class="bloque tarjeta" data-id="'+it.id+'"><h3>'+esc(t)+'</h3><div class="pie">'+esc(it.nombre)+'</div>';
  if(it.tipo==='desconocido'){
    h+='<p>No sé qué es este archivo. '+esc(it.porque||'')+'</p>';
  } else if(it.tipo==='copia'||it.tipo==='copia2'){
    h+=(it.tipo==='copia2'?'<p>Es una copia antigua de esta versión. Cargarla sustituye lo que hay en esta versión; la app de siempre no se toca.</p>':
        '<p>Es una copia de seguridad'+(it.json&&it.json._exported?' del '+fecha(it.json._exported):'')+'. Restaurarla sustituye tus datos en las dos apps, y se puede deshacer.</p>')+
      '<div class="acciones"><button type="button" class="btn sec" data-acc="copia">'+(it.tipo==='copia2'?'Cargar esta copia':'Restaurar esta copia')+'</button>';
  } else if(it.error){
    h+='<p class="neg">'+esc(it.error)+'</p>';
  } else {
    h+=cuerpo(it);
  }
  if(it.tipo!=='copia'&&it.tipo!=='copia2')h+='<div class="acciones">';
  if(aplicable(it))h+='<button type="button" class="btn" data-acc="aplicar">'+(it.tipo==='historico'&&!(it.nav&&it.nav.res&&it.nav.res.valorado)?'Guardar el histórico':'Aplicar')+'</button>';
  if(it.tipo==='ajustes'&&!it.error)h+='<button type="button" class="btn" data-acc="ajustes">Cargar mis ajustes</button>';
  h+='<button type="button" class="btn sec" data-acc="quitar">Descartar</button></div></div>';
  return h;
}
function cuerpo(it){
  const d=it.dif, C=it.cap||{alerts:[],confirms:[]};
  const todos=[...C.confirms,...C.alerts];
  const txt=todos.find(x=>/He le[ií]do/.test(x))||todos[0]||'';
  let h='';
  if(it.tipo==='banco'||it.tipo==='banco_tr'||it.tipo==='banco_ob'){
    const leido=(String(txt).split('\n').find(l=>/He le[ií]do/.test(l))||'');
    if(leido)h+='<p class="pie">'+esc(leido)+'</p>';
    const si=d.ingresos.reduce((s,x)=>s+x[2],0), sg=d.gastos.reduce((s,x)=>s+x[2],0);
    const cats={}; d.gastos.forEach(x=>{cats[x[3]]=(cats[x[3]]||0)+1;});
    const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([c,n])=>esc(nombreCat(c))+' '+n).join(', ');
    const dup=contar(txt,/(\d+) ya registrados/)||contar(txt,/(\d+) ya los ten[ií]as/), om=contar(txt,/(\d+) (?:traspasos|omitidos)/);
    // v168 · cuáles se han tomado por traspasos entre tus cuentas, para que se vea
    const omitidos=((/Omitidos como traspaso propio[^\n]*:\n((?: {3}.*(?:\n|$))+)/.exec(txt)||[])[1]||'').split('\n').map(x=>x.trim()).filter(x=>x&&!/^…/.test(x));
    h+='<p class="estado">'+(d.ingresos.length||d.gastos.length
      ?('<b>'+d.ingresos.length+'</b> ingreso(s) por <span class="num">'+eur(si)+'</span> y <b>'+d.gastos.length+'</b> gasto(s) por <span class="num">'+eur(sg)+'</span>'+(top?('<br><span class="pie">'+top+'</span>'):''))
      :(dup||!om?'Nada nuevo: ya tenías todos estos movimientos.':'Ningún ingreso ni gasto nuevo.'))+'</p>';
    if(dup||om)h+='<p class="pie">'+(dup?dup+(dup===1?' ya lo tenías':' ya los tenías'):'')+(dup&&om?', ':'')+
      (om?(om===1?'1 traspaso entre tus cuentas o a bolsa, que no es ni ingreso ni gasto':om+' traspasos entre tus cuentas o a bolsa, que no son ni ingreso ni gasto')+
        (omitidos.length?': '+omitidos.slice(0,3).map(esc).join('; ')+(omitidos.length>3?'…':''):''):'')+'.</p>';
    const viejo=todos.find(x=>/M[AÁ]S RECIENTE/i.test(x));
    if(it.saldo&&it.saldo.info){
      const S=it.saldo, cuentas=d.cuentas||[], G=S.guess||{};

// ─── Qué es cada archivo: se mira por dentro, no por el nombre ─────
async function detectar(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  const it={id:'f'+Date.now()+Math.random().toString(36).slice(2,6),file,buf,nombre:file.name,tipo:null};
  const pk=buf[0]===0x50&&buf[1]===0x4B, ole=buf[0]===0xD0&&buf[1]===0xCF;
  const pdf=buf[0]===0x25&&buf[1]===0x50&&buf[2]===0x44&&buf[3]===0x46;
  // v169 · una foto o una captura no se lee como extracto: se dice qué es
  const img=(buf[0]===0xFF&&buf[1]===0xD8&&buf[2]===0xFF)||(buf[0]===0x89&&buf[1]===0x50&&buf[2]===0x4E&&buf[3]===0x47)||
    (buf[0]===0x47&&buf[1]===0x49&&buf[2]===0x46)||/^ftyp(heic|heix|hevc|mif1|avif)/.test(String.fromCharCode(...buf.slice(4,12)))||/^image\//.test(file.type||'');
  if(img){ it.tipo='desconocido'; it.porque='Es una imagen (una foto o una captura de pantalla). La app lee los archivos que descargas del banco o del bróker —PDF, CSV, Excel o el .zip de XTB—, no fotos: descárgalo desde su web o su app.'; return it; }
  try{
    if(!pk&&!ole&&!pdf){
      const t0=new TextDecoder().decode(buf.slice(0,2000)).trim();
      if(t0[0]==='{'){
        const j=JSON.parse(new TextDecoder().decode(buf));
        if(j&&j._tipo==='dlv-ajustes-personales'){it.tipo='ajustes';it.json=j;return it;}   // v169
        if(j&&j.v===2&&j.mov){it.tipo='copia2';it.json=j;return it;}
        if(j&&j.cfg){it.tipo='copia';it.json=j;return it;}
      }
    }
    if(pdf){
      await cargarPdf(); legado();
      it.lines=await E('extractPdfLines')(file);
      const r=E('parseNominaLines')(it.lines);
      if(r&&r.ym&&r.nd&&r.nd.devengos&&r.nd.devengos.length){it.tipo='nomina';it.nomina=r;return it;}
      const F=E('trExtractoFilas')(it.lines);
      if(F&&F.length>1){it.tipo='banco_tr';it.filas=F;return it;}
      // v168 · el extracto de Openbank: la tabla se lee con la posición de cada texto
      if(E('obEsExtracto')(it.lines)){
        const O=E('obExtractoFilas')(await E('extractPdfItems')(file));
        if(O&&O.filas.length>1){it.tipo='banco_ob';it.filas=O.filas;it.ob=O.cuenta;return it;}
        it.tipo='desconocido'; it.porque='Es un extracto de Openbank, pero no he encontrado ningún movimiento dentro.'; return it;
      }
      it.tipo='desconocido'; it.porque='Es un PDF, pero no es ni una nómina ni un extracto de Trade Republic o de Openbank.'; return it;
    }
    legado();
    if(pk||ole){
      const X=E('xtbParse')(buf);
      if(X&&!X.err&&((X.rows&&X.rows.length)||X.cash!=null)){it.tipo='cartera';it.broker='XTB';return it;}
      it.tipo='banco';return it;
    }
    const txt=E('bankTexto')(buf); it.texto=txt;
    // v169 · el estado de cuenta de DEGIRO y el histórico de un fondo (Investing)
    if(E('dgcEs')(txt)){ it.tipo='dgcuenta'; return it; }
    if(E('navEsCSV')(txt)){ const S=E('navParseCSV')(txt); if(S&&!S.err&&S.serie&&S.serie.length){ it.tipo='historico'; it.serie=S.serie; return it; } }
    const cab=txt.slice(0,400).toLowerCase();
    if(/producto|product/.test(cab)&&/(symbol\/isin|valor en eur|value in eur)/.test(cab)){
      const D=E('degiroParse')(txt);
      if(D&&!D.err&&D.rows&&D.rows.length){it.tipo='cartera';it.broker='DEGIRO';return it;}
    }
    const T=E('dgTxParse')(txt);
    if(T&&!T.err&&T.ops&&T.ops.length){it.tipo='dgtx';return it;}
    it.tipo='banco'; return it;
  }catch(e){ it.tipo='desconocido'; it.porque=String(e&&e.message||e); return it; }
}

// ─── Ejecutar un archivo con el motor de siempre ───────────────────
async function ejecutar(it){
  if(it.tipo==='banco'){
    E('_bankTR=false'); const F=E('bankFilas')(it.buf);
    if(!F||!F.length)throw new Error('No he encontrado ninguna fila en el archivo.');
    E('processBankRows')(F);
  } else if(it.tipo==='banco_tr'){
    E('_bankTR=true'); E('processBankRows')(it.filas);
  } else if(it.tipo==='banco_ob'){
    // v168 · el motor sabe así de qué cuenta es y propone esa, o crearla
    LEG.tmp=it.ob; E('_bankTR=false; _bankHint=__LEG.tmp;');
    try{ E('processBankRows')(it.filas); }finally{ E('_bankHint=null;'); }
  } else if(it.tipo==='cartera'){
    E('brokerFile')(it.buf,it.nombre,it.file.lastModified);
    const P=E('_dgPending'); if(!P||!P.plan)throw new Error('No he podido leer la cartera.');
    if(it.opc&&it.opc.brokerSel!==undefined){P.brokerSel=it.opc.brokerSel;P.cash=undefined;E('showDegiroPreview()');}
    if(it.opc&&it.opc.efectivo!=null){P.cash=it.opc.efectivo;P.cashManual=true;}
    const o=it.opc||{};
    FD.__fijar('dg-ops',{checked:o.ops!==false});
    FD.__fijar('dg-flows',{checked:o.flujos!==false});
    FD.__fijar('dg-divs',{checked:o.rentas!==false});   // v169 · intereses y dividendos
    (P.plan.nuevas||[]).forEach((r,i)=>FD.__fijar('dg-new-'+i,{checked:o.nuevas!==false}));
    it.plan={fuente:P.fuente,fecha:P.date,upd:(P.plan.upd||[]).map(u=>({nombre:u.stk.name,eur:u.row.eur,antes:u.prev})),
      nuevas:(P.plan.nuevas||[]).map(r=>({nombre:r.prod,eur:r.eur})),faltan:(P.plan.faltan||[]).map(s=>s.name),
      cash:P.cash,brokerSel:P.brokerSel,ops:(P.parsed.ops||[]).map(x=>({fecha:x.date,tipo:x.tipo,nombre:x.prod,n:x.n,eur:x.valEUR})),
      flujos:(P.parsed.cashOps||[]).filter(x=>x.flujo).length,desde:P.parsed.desde,hasta:P.parsed.hasta,
      // v167 · de dónde sale la liquidez, o por qué este archivo no basta
      efeModo:P.efe?P.efe.modo:null,efeTexto:P.efe?E('xtbEfectivoMotivo')(P.efe,P.parsed):''};
    E('degiroCommit()');
  } else if(it.tipo==='dgtx'){
    const P=E('dgTxParse')(it.texto); if(P.err)throw new Error(P.err);
    LEG.tmp=P.ops; E('_dgPend=__LEG.tmp; dgTxRevisar();');
  } else if(it.tipo==='nomina'){
    const r=it.nomina; LEG.nomRes=null;
    E('nominaAddOrEnrich')(r.ym,'Nómina '+r.ym,r.liquido,r.nd); E('save()');
  } else if(it.tipo==='historico'){
    // v169 · el histórico de VL de un fondo: se guarda y, si es de tu clase, pone el fondo al día
    const C=E('navGuessFund')(it.serie)||[];
    const fondos=JSON.parse(E('JSON.stringify((cfg.funds||[]).map(f=>({fid:f.id,name:f.name})))'));
    if(!fondos.length)throw new Error('No tienes ningún fondo dado de alta: créalo antes en «Tus cuentas, fondos, brókers y deudas».');
    fondos.forEach(f=>{const c=C.find(x=>x.fid===f.fid); f.dif=c?c.dif:null;});
    const fid=(it.opc&&it.opc.fondo)||(C[0]?C[0].fid:fondos[0].fid);
    const res=E('navAplicar')(it.serie,fid,it.nombre);
    if(res.err)throw new Error(res.err);
    E('savePersonal()'); E('save()');
    const S=it.serie;
    it.nav={n:S.length,desde:S[0][0],hasta:S[S.length-1][0],ultVL:S[S.length-1][1],fid,fondos,res};
  } else if(it.tipo==='dgcuenta'){
    // v169 · el estado de cuenta de DEGIRO: dividendos y, si quieres, ingresos y retiradas
    const o=it.opc||{};
    LEG.tmp=E('degiroCuentaParse')(it.texto);
    if(LEG.tmp.err)throw new Error(LEG.tmp.err);
    const N=E('(function(){const P=__LEG.tmp,bk=dgcBroker(),N=dgcNuevos(P,bk);return {ren:N.ren,flu:N.flu,bk:bk?bk.name:null};})()');
    const P=LEG.tmp;
    it.dgc={n:P.n,desde:P.desde,hasta:P.hasta,ren:N.ren,flu:N.flu,bk:N.bk,sinCambio:P.sinCambio,total:P.rentas.length};
    E('dgcAplicar(__LEG.tmp,'+JSON.stringify({divs:o.rentas!==false,flujos:o.flujos===true})+')');
    E('save()');
  } else throw new Error('No sé qué hacer con este archivo.');
}

// ─── Aplicar: de verdad, con copia para deshacer ───────────────────
// v166 · En la copia van solo tus datos de la app de siempre. Fuera su propia
// copia de deshacer (dlv_undo), que deja de valer en cuanto se cambia algo aquí,
// y lo de esta versión (dlv2_*), que se recalcula sola a partir de lo demás.
// Antes iban las tres cosas y la copia ocupaba el doble de lo necesario.
const enCopia=k=>/^dlv_/.test(k)&&k!=='dlv_undo'&&k!=='dlv_almacen';
function fotoCruda(){
  const o={};
  for(let i=0;i<ALM.length;i++){const k=ALM.key(i); if(enCopia(k))o[k]=ALM.getItem(k);}
  return o;
}
// La copia para deshacer se toma una vez por cambio: si aplicas varios archivos
// de golpe, «Deshacer» los quita todos juntos, que es lo que se espera.
function guardarCopiaDeshacer(que){
  const cruda=fotoCruda();
  try{ ALM.setItem(UNDO_KEY,JSON.stringify({cuando:new Date().toISOString(),que,datos:cruda})); return cruda; }
  catch(e){
    if(!confirm('No cabe en el navegador la copia que permite deshacer. Si sigues, el cambio se hace igual, pero no se podrá deshacer. ¿Seguir?'))return null;
    // la copia anterior ya no vale: deshacerla se llevaría también este cambio
    try{ ALM.removeItem(UNDO_KEY); }catch(_){}
    return cruda;
  }
}
// La copia de deshacer de la app de siempre se queda vieja con cualquier cambio
// hecho aquí: si la usaras después, se llevaría también este. Fuera.
function olvidarDeshacerViejo(){ try{ ALM.removeItem('dlv_undo'); }catch(e){} }
async function aplicar(it,enLote){
  legado();
  const cruda=enLote?fotoCruda():guardarCopiaDeshacer(describir(it));
  if(!cruda)return false;
  LEG.cap={alerts:[],confirms:[],prompts:[]}; LEG.respConfirm=responder;
  LEG.respPrompt=(s,d)=>{const o=it.opc||{};
    if(o.cuenta==='nuevo'){ const m=/(\d+)\) Crear la cuenta/.exec(String(s||'')); return m?m[1]:''; }
    if(o.cuenta!==undefined)return o.cuenta===''?'':String(o.cuenta+1); return d||'';};
  LEG.modo='real';
  try{ await ejecutar(it); }
  catch(e){ restaurar(cruda); throw e; }
  recargarLegado();
  olvidarDeshacerViejo();
  // la versión nueva se recalcula a partir de lo que ha quedado
  DB=migrar(leerAppActual(ALM),'app actual'); guardar();
  return true;
}
// v166 · Volver a una copia toca solo tus datos de la app de siempre; lo de esta
// versión se recalcula a partir de ellos. Vale también para las copias de antes,
// que llevaban además dlv2_db y la copia de deshacer de la app de siempre.
function restaurar(cruda){
  Object.keys(cruda).forEach(k=>{ if(enCopia(k))ALM.setItem(k,cruda[k]); });
  for(let i=ALM.length-1;i>=0;i--){const k=ALM.key(i); if(enCopia(k)&&!(k in cruda))ALM.removeItem(k);}
  if(LEG.fn)recargarLegado();
  const old=leerAppActual(ALM);
  if(old){ DB=migrar(old,'app actual'); guardar(); }
  else cargar();
}

function deshacer(){
  const u=ultimoCambio(); if(!u)return false;
  restaurar(u.datos); ALM.removeItem(UNDO_KEY); return true;
}

// ─── Cambiar algo, con el motor de siempre y con copia para deshacer ──
// fn recibe una función para rellenar las casillas que lee el motor viejo.

// Barras mensuales en SVG, del mismo estilo que el gráfico de «Hoy»
function barrasMes(M,op){
  op=op||{};
  if(!M.length)return vacio('Sin meses en este periodo.');
  const W=640,H=180,pl=6,pr=6,pt=8,pb=20, n=M.length;
  const max=Math.max(1,...M.map(x=>Math.max(x.ing,x.gas)))*1.05;
  const bw=(W-pl-pr)/n, g=Math.min(3,bw*.18), w=Math.max(1,(bw-g*1.5)/2);
  const Y=v=>pt+(H-pt-pb)*(1-v/max);
  let s='<svg class="grafico barras" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(op.aria||'Ingresos y gastos por mes')+'">';
  M.forEach((x,i)=>{ const x0=pl+i*bw+g/2;
    s+='<rect class="b-ing" x="'+x0.toFixed(1)+'" y="'+Y(x.ing).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(H-pb-Y(x.ing)).toFixed(1)+'"/>';
    s+='<rect class="b-gas" x="'+(x0+w).toFixed(1)+'" y="'+Y(x.gas).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(H-pb-Y(x.gas)).toFixed(1)+'"/>'; });
  const paso=n>60?24:(n>30?12:(n>14?3:1));
  M.forEach((x,i)=>{ if(i%paso===0||(paso===1)) s+='<text class="eje" x="'+(pl+i*bw+bw/2).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle">'+(n>30?x.ym.slice(0,4):mesCorto(x.ym))+'</text>'; });
  return s+'</svg><div class="leyenda-mini"><span><i class="b-ing"></i>Ingresos</span><span><i class="b-gas"></i>Gastos</span></div>';
}
// Línea sencilla (proyecciones, valor de un fondo)
function linea(series,op){
  op=op||{};
  const pts=series.flatMap(s=>s.p); if(!pts.length)return '';
  const W=640,H=op.h||180,pl=8,pr=8,pt=10,pb=22;
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs), y1=Math.max(...ys)*1.06, y0=Math.min(0,Math.min(...ys));
  const X=v=>pl+(W-pl-pr)*((v-x0)/((x1-x0)||1)), Y=v=>pt+(H-pt-pb)*(1-(v-y0)/((y1-y0)||1));
  let s='<svg class="grafico" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(op.aria||'')+'">';
  series.forEach(se=>{ if(!se.p.length)return;
    const d=se.p.map((p,k)=>(k?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
    if(se.area)s+='<path class="area" d="'+d+' L'+X(se.p[se.p.length-1][0]).toFixed(1)+' '+(H-pb)+' L'+X(se.p[0][0]).toFixed(1)+' '+(H-pb)+' Z"/>';
    s+='<path class="'+(se.cls||'trazo')+'" d="'+d+'"/>';
    (se.marcas||[]).forEach(m=>{ s+='<circle class="marca-p" cx="'+X(m[0]).toFixed(1)+'" cy="'+Y(m[1]).toFixed(1)+'" r="3"/>'; });
  });
  (op.ejeX||[]).forEach(e=>{ s+='<text class="eje" x="'+X(e[0]).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+e[1]+'</text>'; });
  return s+'</svg>';
}

      '<div class="acciones"><button type="button" class="btn" data-recat="'+g.i+'">Clasificar</button><button type="button" class="btn sec" data-recatig="'+g.i+'">'+(g.ig?'Volver a preguntar':'Es «Otro»')+'</button></div></div></li>').join('')+'</ul>'+

  if(!PD||!PD.length)s+=vacio('Nada pendiente de cobro. Si pagas algo que te van a devolver, búscalo en Movimientos y márcalo: dejará de contar como gasto tuyo sin dejar de estar apuntado.');
  else s+='<ul class="lista-simple">'+PD.map(x=>'<li><span>'+esc(x.name)+', '+fecha(x.date)+(x.nota?' <small>'+esc(x.nota)+'</small>':'')+'</span><b class="num">'+eur(x.imp)+'</b>'+

  // ── Reglas ──
  s+=seccionReglas();
  return s;
}

          r+=campo('¿De qué acción es?',sel('mv-stk-'+k,[['','Sin asignar']].concat((A||[]).map((a,i)=>[String(i+1),a.name])),x.stock?String((A||[]).findIndex(a=>a.id===x.stock)+1):''))+
            '<div class="acciones"><button type="button" class="btn sec" data-mvstk="'+k+'">Asignar</button></div>'; }
      }

function seccionReemb(){

// Abre el formulario con un apunte ya marcado y las fechas de alrededor
function abrirComp(t,id){
  const C=Q('rbcand',P=>P.reembCandidatos());
  const x=(t==='g'?C.gas:C.ing).find(y=>y.id===id);
  const F={g:{},i:{},qg:'',qi:'',desde:'',hasta:'',resto:true,notas:{},pre:x?t:null};
  if(x){ F[t][id]=true; const d=new Date(x.date+'T00:00:00'), a=new Date(d), z=new Date(d);
    a.setDate(a.getDate()-120); z.setDate(z.getDate()+120);
    F.desde=isoL(a); F.hasta=(isoL(z)<HOY()?isoL(z):HOY()); }
  else { const d=new Date(HOY()+'T00:00:00'); d.setDate(d.getDate()-90); F.desde=isoL(d); F.hasta=HOY(); }
  FL.comp=F; FL.abierto=null; pintar();
  setTimeout(()=>{const e=document.getElementById('fl-comp');if(e)e.scrollIntoView({block:'start'});},30);
}
function formComp(){
  const C=Q('rbcand',P=>P.reembCandidatos()), F=FL.comp;
  const selG=C.gas.filter(x=>F.g[x.id]), selI=C.ing.filter(x=>F.i[x.id]);
  const tG=selG.reduce((s,x)=>s+x.amt,0), tI=selI.reduce((s,x)=>s+x.amt,0), dif=Math.round((tI-tG)*100)/100;
  // lo que falta por cuadrar, para poner primero lo que más se le parece
  const falta=Math.abs(dif);
  const orden=(L,lado)=>{ const hay=(lado==='g'?selI.length:selG.length)>0&&falta>0.009;
    return hay?L.slice().sort((a,b)=>Math.abs(a.amt-falta)-Math.abs(b.amt-falta)||String(b.date).localeCompare(String(a.date))):L; };
  const lista=(L,lado,q)=>{ q=String(q||'').toLowerCase();
    const V=orden(L.filter(x=>!(lado==='g'?F.g:F.i)[x.id]&&x.date>=F.desde&&x.date<=F.hasta&&(!q||(x.desc+' '+x.label).toLowerCase().includes(q))),lado).slice(0,50);
    return V.length?'<ul class="checks">'+V.map(x=>'<li><label><input type="checkbox" data-cp="'+lado+'|'+x.id+'"> <span class="num">'+fecha(x.date)+'</span> '+esc(x.desc.slice(0,42))+
      ' <b class="num '+(lado==='i'?'pos':'')+'">'+(lado==='i'?'+':'')+eur(x.amt)+'</b></label></li>').join('')+'</ul>':vacio('Nada con ese filtro entre esas fechas.'); };
  let s='<div class="bloque"><h3>Nueva compensación</h3>';
  s+=(selG.length||selI.length)?'<ul class="lista-simple">'+selG.map(x=>'<li><span>'+esc(x.desc)+'<small>'+fecha(x.date)+', gasto</small></span><b class="num neg">−'+eur(x.amt)+'</b><button type="button" class="enlace" data-cpx="g|'+x.id+'">Quitar</button></li>').join('')+
      selI.map(x=>'<li><span>'+esc(x.desc)+'<small>'+fecha(x.date)+', ingreso</small></span><b class="num pos">+'+eur(x.amt)+'</b><button type="button" class="enlace" data-cpx="i|'+x.id+'">Quitar</button></li>').join('')+'</ul>'
    :'<p class="estado">Marca abajo los gastos y los ingresos que se anulan.</p>';
  if(selG.length&&selI.length){
    s+='<p class="estado">'+(Math.abs(dif)<0.01?'Cuadran al céntimo: desaparecen los dos lados.':
      (dif<0?'Te quedan <b class="num">'+eur(-dif)+'</b> de gasto tuyo, en «'+esc(selG.slice().sort((a,b)=>b.amt-a.amt)[0].label)+'».':
        'Te quedan <b class="num">'+eur(dif)+'</b> de ingreso, como «'+esc(selI.slice().sort((a,b)=>b.amt-a.amt)[0].label)+'».'))+'</p>';
    if(Math.abs(dif)>=0.01)s+='<label class="chk"><input type="checkbox" id="cp-resto"'+(F.resto?' checked':'')+'> Que esa diferencia siga contando (desmárcalo si es un redondeo)</label>';
  }
  s+='<div class="rango">'+campo('Desde','<input type="date" id="cp-d" value="'+F.desde+'">')+campo('Hasta','<input type="date" id="cp-h" value="'+F.hasta+'">')+'</div>';
  const bG='<h3 class="h3">Gastos</h3>'+inp('cp-qg',F.qg,{ph:'Buscar gasto: restaurante, tributo…',attr:' type="search"'})+lista(C.gas,'g',F.qg);
  const bI='<h3 class="h3">Ingresos</h3>'+inp('cp-qi',F.qi,{ph:'Buscar ingreso: bizum, devolución…',attr:' type="search"'})+lista(C.ing,'i',F.qi);
  // primero el lado que falta por rellenar
  s+=(F.pre==='g'||(selG.length&&!selI.length))?bI+bG:bG+bI;
  s+='<div class="acciones">'+(selG.length&&selI.length?'<button type="button" class="btn" id="cp-guardar">Guardar compensación</button>':'')+'<button type="button" class="btn sec" id="cp-cancelar">Cancelar</button></div></div>';
  return s;
}

const IV={per:'todo',abierta:null,cerrada:null,fper:'todo',evol:'eur'};
function pInv(){

  // ── Cómo van ──
  if(B){

    s+='<p class="tienes">'+(B.todo?'Has ganado':'Has ganado '+B.label)+'</p><div class="cifra num '+((B.totBen||0)<0?'neg':'')+'">'+(B.totBen>=0?'+':'')+ent+'<small> €</small></div>'+

      let sub='';
      if(B.todo){ sub=r.rate!=null?('al año, ponderado por dinero y tiempo: <b class="num '+cls(r.rate)+'">'+pctS(r.rate,1)+'</b>'):'';

          (r.simple!=null?'. Sin contar cuándo metiste el dinero: <b class="num '+cls(r.simple)+'">'+pctS(r.simple,1)+'</b>':'')+(n.txt?'. '+limpia(n.txt).replace(/^[\s,]+/,''):''); }
      return fila('<i class="punto-c" style="background:var('+col+')"></i>'+r.n,r.ben==null?'—':'<span class="'+cls(r.ben)+'">'+eurS(r.ben)+'</span>',sub);

  // ── Acciones que tienes ──

  if(!PO||!PO.abiertas.length)s+=vacio('No tienes acciones abiertas.');
  else{
    const lat=PO.abiertas.reduce((t,o)=>t+o.pnl,0);
    s+='<p class="pie">Lo que va ganando o perdiendo cada una contra lo que te costó. Toca una para ver sus compras, repartidas por FIFO como hace Hacienda. En total, <span class="num '+cls(lat)+'">'+eurS(lat)+'</span> sin realizar.</p>';

      if(ab)r+='<div class="det">'+detalleAbierta(o,PO)+'</div>';

  }
  // ── Las que ya vendiste ──

        '<b class="num '+cls(o.pnl)+'">'+eurS(o.pnl,2)+'<small>'+pctS(p)+'</small></b></button>';

    if(K){
      const d=K.disp;
      s+='<p class="pie">'+(d.nP===0&&d.nG>0?'Todas las que has cerrado eran ganadoras, y las tuviste de media '+Math.round(d.dG)+' días. Las perdedoras siguen abiertas: es el efecto disposición en su forma más clara, vender pronto lo que gana y aguantar lo que pierde.'

      if(K.grupos.length)s+=plegable('iv-setup','Por idea y setup',tabla(['Idea y setup','Ops.','Acierto','Resultado','Media'],K.grupos.map(g=>[esc(g.idea)+(g.setup?', '+esc(g.setup):'')+'<small>'+Math.round(g.dias)+' días de media'+(g.ml!=null?', ganan '+pctS(g.mg)+' y pierden '+pctS(g.ml):'')+'</small>',
        g.n,pct(g.acierto),'<span class="'+cls(g.benef)+'">'+eurS(g.benef)+'</span>',pctS(g.ret)]))+
        (K.grupos.some(g=>g.n<5)?'<p class="pie">Con menos de cinco operaciones, los porcentajes pueden ser suerte: tómalos como pista, no como conclusión.</p>':'')+
        (K.motivos.length?tabla(['Motivo de salida','Ops.','Acierto','Resultado'],K.motivos.map(m=>[esc(m.motivo),m.n,pct(m.acierto),eurS(m.benef)])):'<p class="pie">Si al vender apuntas el motivo, aquí verás si vendes por método o por emoción.</p>'));

  // ── Tu capital en bolsa ──
