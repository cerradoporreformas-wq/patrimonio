    const a=K.a;
    s+='<h2>Tu dinero en bolsa</h2><div class="filas">'+
      fila('Capital medio',eur(a.avgCapital,0),'lo que has tenido invertido de media, ponderado por el tiempo')+
      fila('Rendimiento sobre él',pctS(a.retOnAvg),'en '+n1(K.years)+' años, desde el '+fecha(a.firstDate))+
      fila('Lo máximo a la vez',eur(a.peak,0),'tu mayor exposición simultánea')+'</div>';
    if(K.byIdea.length>1)s+=tabla(['Idea','Al año','Resultado','Capital medio'],K.byIdea.map(x=>[esc(x.label),x.m&&x.m.rate!=null?pctS(x.m.rate,1):'—',
      x.m?'<span class="'+cls(x.m.totalProfit)+'">'+eurS(x.m.totalProfit)+'</span>':'—',x.m?eur(x.m.avgCapital,0):'—']));
    const EV=Q('evol',P=>P.evolucion());
    if(EV&&EV.length>5){
      const ult=EV[EV.length-1], anios={}; EV.forEach(p=>{const y=p.date.slice(0,7);if(!anios[y])anios[y]=p.date;});
      const t=p=>Date.parse(p.date);
      s+='<h3 class="h3">Tu cartera de acciones, día a día</h3>'+chips('evol',[['eur','En euros'],['rent','Rentabilidad']],IV.evol)+
        linea([{p:EV.map(p=>[t(p),IV.evol==='eur'?p.eur:(p.rent||0)]),area:IV.evol==='eur'}],{aria:'Evolución de la cartera',ejeX:Object.values(anios).filter((d,i)=>i%3===0).map(d=>[Date.parse(d),mesCorto(d.slice(0,7))])})+
        '<p class="pie">'+(IV.evol==='eur'?'Lo que valen tus acciones cada día, sin el efectivo del bróker. Sube también cuando compras: por eso existe la otra vista.':'Rentabilidad encadenada (TWR): neutraliza lo que metes y sacas, para que no la mueva cuándo compraste. Desde el '+fecha(EV[0].date)+': <b class="num '+cls(ult.rent)+'">'+pctS((ult.rent||0)/100,1)+'</b>.')+'</p>';
    }
  }
  // ── Fondos ──
  s+='<h2 id="iv-fondos">Fondos</h2>'+chips('fper',[['3m','3 meses'],['1a','1 año'],['ytd','Este año'],['todo','Desde el principio']],IV.fper);

      (f.vl?fila('Valor liquidativo',n2(f.vl)+' €','el tuyo: valor entre '+String(f.parts).replace('.',',')+' participaciones. Si no coincide con el publicado, las participaciones o la fecha no cuadran'):'')+'</div>';

    b+=plegable('isin-'+f.id,'ISIN y valor liquidativo histórico',

      (f.navMeta?'<button type="button" class="btn peligro" data-navdel="'+f.id+'">Quitar el histórico</button>':'')+'</div>');
    return b+'</div>';}).join('');
  // ── Lo que has metido en cada bróker ──
  const BR=Q('brokers',P=>P.brokers())||[];

const n2=v=>(Number(v)||0).toFixed(2).replace('.',',');
function rangosFondos(){
  const hoy=HOY(), d=new Date(hoy+'T00:00:00'); let from='';
  if(IV.fper==='3m'){d.setMonth(d.getMonth()-3);from=isoL(d);}
  else if(IV.fper==='1a'){d.setFullYear(d.getFullYear()-1);from=isoL(d);}
  else if(IV.fper==='ytd')from=hoy.slice(0,4)+'-01-01';
  const R={}; (DB?DB.activos:[]).filter(a=>a.tipo==='fondo').forEach(a=>R[a.id]={from,to:''}); return R;
}
function tablaLotes(L,cerrada){
  if(!L||!L.length)return '';
  return '<h3 class="h3">Cada compra</h3>'+tabla(['Compra','Resultado'],L.map(l=>[
    fecha(l.date)+', <span class="num">'+String(Math.round(l.sh*100)/100).replace('.',',')+'</span> a <span class="num">'+n2(l.cps)+' €</span>'+
      '<small>'+eur(l.coste,2)+(l.difMedio!=null?'; '+(l.difMedio<0?'un '+pct(Math.abs(l.difMedio)/100,1)+' por debajo':'un '+pct(l.difMedio/100,1)+' por encima')+' de tu coste medio de entonces':', la primera')+
      (l.estado==='cerrada'?'; vendida el '+fecha(l.salida):(l.estado==='parcial'?'; vendida en parte':''))+
      (l.r&&l.r.n?'; llegó a '+pctS(l.r.max/100,1)+' y a '+pctS(l.r.min/100,1)+(l.r.minEur<0?', perdiendo hasta '+eur(-l.r.minEur,2):'')+' ('+l.r.n+' valoraciones)':'')+'</small>',

    cambiar(v?'ISIN guardado':'ISIN borrado',()=>E('setFundIsin('+jsq(id)+','+jsq(v)+')'));});
  document.querySelectorAll('[data-bfdel]').forEach(b=>b.onclick=()=>{if(!confirm('¿Borrar este movimiento del bróker?'))return;

async function cargarNav(fid,file){
  const txt=await file.text(); puente();
  let R=null; try{ R=E('navParseCSV')(txt); }catch(e){}
  if(!R||R.err||!R.serie||!R.serie.length){ aviso2('No he sabido leer ese archivo como histórico de valor liquidativo'+(R&&R.err?': '+esc(R.err):'.'),false); return; }

}
async function cargarPrecios(stockId,file){
  if(!stockId){aviso2('Elige primero de qué acción son los precios.',false);return;}
  const txt=await file.text(); puente();
  let R=null; try{ R=E('stkParseCSV')(txt); }catch(e){}
  if(!R||R.err||!R.serie||!R.serie.length){ aviso2('No he sabido leer precios en ese archivo'+(R&&R.err?': '+esc(R.err):'.'),false); return; }
  // stkGuardar comprueba la escala (peniques, dólares) y pregunta: se contesta que sí, como harías tú
  cambiar('precios cargados',()=>{LEG.tmp={serie:R.serie,archivo:file.name};E('_stkPending=__LEG.tmp; stkGuardar('+jsq(stockId)+','+jsq(file.name)+')');},{verAvisos:true});
}

function pSueldo(){

    if(PR.clasif){ const C=PR.clasif;

    s+='<div class="rango">'+campo('Tu puesto actual',sel('su-actual',PU.lista.map(p=>[p.id,p.nombre]),cur.id))+'</div>';

    if(comparar){
    s+='<h2>Tu puesto, euro a euro</h2>';

      /*IPT*/...(IPT?[['Tu IPT<small>tributa, no está exenta</small>','—',eur(y.ipt)]]:[]),/*/IPT*/

function pImp(){
  const anio=new Date().getFullYear();

    s+='<div class="filas">'+
      (R.porVentas>0?fila('Por vender acciones',eur(R.porVentas),'nadie te retiene nada por ellas: el dinero ya lo cobraste entero'):'')+
      /*IPT*/(R.dosPagadores?fila('Dos pagadores','','la nómina retiene como si la IPT no existiera y la Seguridad Social, como si no existiera la nómina. Juntas caen en un tramo más alto, y esa diferencia aparece entera en junio.'):'')+/*/IPT*/
    '</div>';

      ['Cotizaciones<small>MUFACE y derechos pasivos</small>','−'+eur(R.cotiz)],
      ['Otros gastos','−'+eur(R.gastos-R.gastoDisc)],
      ['Por discapacidad<small>trabajador activo</small>','−'+eur(R.gastoDisc)],
      Object.assign(['Base general',eur(R.baseGen)],{attr:' class="suma"'}),
      ['Ganancias por vender acciones<small>'+R.G.n+' operaciones, FIFO'+
        (R.G.aplazadas>0?'; '+eur(R.G.aplazadas)+' de pérdidas que aún no cuentan porque recompraste antes de dos meses':'')+
        (R.G.integradas<0?'; '+eur(-R.G.integradas)+' de pérdidas aplazadas que ya cuentan':'')+'</small>',eurS(R.G.neto,2)],
      ['Intereses y dividendos<small>'+eur(R.K.cobrado)+' brutos cobrados'+(R.K.proy>0?' y '+eur(R.K.proy)+' estimados':'')+
        (R.K.dividendos>0?'; '+eur(R.K.dividendos)+' de dividendos':'')+'</small>',eur(R.K.total)],
      Object.assign(['Base del ahorro',eur(R.baseAho)],{attr:' class="suma"'}),
      ['Mínimo personal<small>el autonómico, '+eur(R.minAut)+'</small>','−'+eur(R.minEst)],
      ['Escala general',eur(R.cuotaGen)],['Escala del ahorro',eur(R.cuotaAho)],
      ['Deducciones autonómicas'+(R.deducAutHeredada?'<small>las de tu última declaración</small>':''),'−'+eur(R.deducAut)],

      /*IPT*/...(R.retIPT?[['Retenido en la IPT','−'+eur(R.retIPT)]]:[]),/*/IPT*/
      [(R.K.dividendos>0?'Retenido en intereses y dividendos':'Retenido en los intereses')+'<small>'+
        (R.K.retEs>0?eur(R.K.retEs)+' que constan en los apuntes':'')+(R.K.retEs>0&&(R.K.sinDato+R.K.proy)>0?'; ':'')+
        ((R.K.sinDato+R.K.proy)>0?'al '+String(A0.capRetPct==null?19:A0.capRetPct).replace('.',',')+' % en los que no lo dicen':'')+'</small>','−'+eur(R.retCap)]]);
    s+=plegable('im-cuenta','La cuenta, pieza a pieza',cuenta+'<p class="pie">Con los datos de la app y las escalas de '+anio+'. No cuenta planes de pensiones ni cambios en tu familia: es para apartar dinero, no una declaración.</p>');

      campo('Deducciones autonómicas, €',inp('fz-deducAuton',A.deducAuton==null?'':String(A.deducAuton).replace('.',','),{ph:'las del año pasado',attr:' inputmode="decimal"'}))+'</div>'+
      '<label class="chk"><input type="checkbox" id="fz-irregular"'+(A.irregular?' checked':'')+'> Reducción del 30 % a los atrasos de más de dos años (hay que marcarla en la declaración)</label>'+
      '<div class="acciones"><button type="button" class="btn sec" id="fz-guardar">Guardar</button></div>');
    } else if(EN_BLANCO){
    s+=vacio('Para prever la renta de '+anio+' hacen falta tus nóminas de este año: échalas al Buzón, en PDF.');
  }
  // ── Plazos ──
  s+='<h2>Plazos</h2>';
  if(PL){
    const hoy=HOY(), dias=f=>Math.round((Date.parse(f)-Date.parse(hoy))/864e5);
    const decl=R?('Declaración '+anio+' (calculada)'):'';

        (x.titulo===decl?'; la de arriba':'')+(x.nota&&x.titulo!==decl?'. '+esc(limpia(x.nota)):'')+'</small></span>'+
        (x.imp!=null&&x.titulo!==decl?'<b class="num">'+eur(x.imp)+'</b>':'')+'</li>').join('')+'</ul>';
    s+=plegable('im-prev','Cambiar o añadir pagos previstos','<ul class="lista-simple">'+PL.prev.map(p=>'<li><span>'+esc(limpia(p.concepto))+'<small>'+fecha(p.fecha)+(p.auto?', lo ha propuesto la app':'')+'</small></span>'+
        (IM.fedit===p.id
          ?'<span class="en-linea">'+inp('fe-imp','',{attr:' inputmode="decimal" class="corto" aria-label="Nuevo importe previsto, en euros"'})+
            '<button type="button" class="enlace" data-fok="'+esc(p.id)+'">Guardar</button><button type="button" class="enlace" data-fno="1">Cancelar</button></span>'
          :'<button type="button" class="enlace" data-fedit="'+esc(p.id)+'">Cambiar importe</button><button type="button" class="enlace" data-fdel="'+esc(p.id)+'">Quitar</button>')+'</li>').join('')+'</ul>'+
      '<div class="rango">'+campo('Cuándo','<input type="date" id="fp-f" value="'+(anio+1)+'-06-30">')+campo('Qué',inp('fp-c','Declaración de la renta'))+campo('Cuánto, €',inp('fp-i','',{attr:' inputmode="decimal"'}))+'</div>'+
      '<div class="acciones"><button type="button" class="btn sec" id="fp-add">Añadir</button></div>');
    if(PL.pagados.length)s+='<p class="pie">Ya pagados a Hacienda: '+PL.pagados.map(x=>fecha(x.date)+' <span class="num">'+eur(x.amt)+'</span>').join(', ')+'.</p>';
  }
  // ── Plusvalías ──
  s+='<h2>Plusvalías</h2>';
  if(PV){
    const bloque=(Y,txt)=>{ if(!Y.ops.length)return '';
      return '<div class="bloque"><h3>'+Y.year+'</h3><p class="pie">'+txt+'</p><div class="filas">'+
        fila('Ganancia neta','<span class="'+cls(Y.totalGain)+'">'+eurS(Y.totalGain,2)+'</span>',Y.ops.length+' ventas'+(Y.lossNeg<0?', con '+eur(-Y.lossNeg)+' de pérdidas que compensan':''))+
        (txt.indexOf('arriba')<0&&RENTA?fila('IRPF',eur(Y.irpf),'al tipo del ahorro'):'')+'</div>'+
        plegable('pv-'+Y.year,'Ver las '+Y.ops.length+' ventas',tabla(['Venta','Resultado'],Y.ops.map(o=>[esc(o.name)+'<small>'+fecha(o.date)+', vendida por '+eur(o.venta,0)+', te costó '+eur(o.coste,0)+'</small>','<span class="'+cls(o.gl)+'">'+eurS(o.gl,2)+'</span>'])))+'</div>'; };
    s+=bloque(PV.cur,'Van a la renta de '+PV.cur.year+(RENTA?': ya están dentro de la cifra de arriba.':'.'));
    s+=bloque(PV.prev,PV.decl&&PV.decl.nota?('Declaradas: '+esc(limpia(PV.decl.nota))+'.'):('Van a la renta de '+PV.prev.year+'.'));
    if(PV.latentes.length&&PV.cur.totalGain>0){
      s+='<p class="estado">Hasta el 31 de diciembre todavía se puede mover: vender con pérdidas compensa euro a euro las ganancias del año. Tienes <b class="num">'+eur(-PV.perdLat,0)+'</b> en pérdidas sin realizar, repartidas en '+PV.latentes.length+' acciones: las que van en rojo en <button type="button" class="enlace" data-ir="inv" data-ancla="iv-abiertas">Acciones que tienes</button>.</p>'+
        '<p class="pie">Si recompras lo mismo antes de dos meses, la pérdida no cuenta (art. 33.5.f). Y no es gratis: te quedas fuera o rotas a otra cosa.</p>';
    }
  }
  // ── Cotejo ──
  s+='<h2>Tu declaración, contra la app</h2>';
  if(!CO.length)s+=vacio('Mete las casillas de tu modelo 100 y la app te dirá qué le falta o le sobra.');
  CO.forEach(C=>{
    const mal=C.filas.filter(f=>Math.abs(f.dif)>1), bien=C.filas.length-mal.length;
    s+='<div class="bloque"><h3>'+C.anio+'</h3><p class="pie">'+esc(limpia(C.nota))+'</p>'+
      (mal.length?('<p class="estado">'+(bien?bien+' casillas cuadran al céntimo. ':'')+'No cuadran:</p>'+tabla(['Casilla','Declarado','A la app'],mal.map(f=>[f.c+' '+esc(f.l),eur(f.decl),'<span class="neg">'+(f.dif>0?'le sobran ':'le faltan ')+eur(Math.abs(f.dif))+'</span>'])))
        :'<p class="estado">Todas las casillas que la app puede saber cuadran al céntimo.</p>')+

      plegable('co-'+C.anio,'Cambiar las casillas de '+C.anio,C.casillas.map(f=>campo(f.c+' '+esc(f.l),inp('dc-'+C.anio+'-'+f.k,f.v==null?'':String(f.v).replace('.',','),{attr:' inputmode="decimal"'}))).join('')+
        '<div class="acciones"><button type="button" class="btn sec" data-decl="'+C.anio+'">Guardar las casillas</button></div>')+'</div>';
  });
  s+='<div class="rango">'+campo('Ejercicio de la declaración',inp('dc-anio',String(anio-1),{attr:' inputmode="numeric" class="corto"'}))+'</div>'+
    '<div class="acciones"><button type="button" class="btn sec" id="dc-nueva">Meter otra declaración</button></div>';
  return s;
}
function enlazarImp(){

    cambiar('pago previsto añadido',()=>E('fiscalAdd()'),{respuestas:[f,c,i]});};
  document.querySelectorAll('[data-decl]').forEach(b=>b.onclick=()=>{const a=b.dataset.decl;
    const C=(Q('cotejo',P=>P.cotejo())||[]).find(x=>x.anio===a); if(!C)return;

function enlazarSituacion(){
  const g=$('#st-guardar'); if(!g)return;

}

function pFuturo(){

    '<div class="linea-res">'+({voluntaria:'la voluntaria, lo antes que puedes',forzosa:'la forzosa: a los '+PE.cfg.edadForzosa+' te jubilan de oficio',prorroga:'con prórroga hasta los '+PE.cfg.edadMaxProlong+', si te la autorizan'}[esc_])+

  // ── Año a año ──
  /*IPT*/const IPT=hayIPT();/*/IPT*/const DISC=hayDisc();
  s+='<h2>Lo que cobrarías, año a año</h2><p class="pie">En euros de hoy. La pensión es la de Clases Pasivas'+/*IPT*/(IPT?'; cada mes se suma la IPT, <span class="num">'+eur(PE.forz.iptMes,0)+'</span>'+(PE.cfg.ipt20?' con el +20 %':''):'')+/*/IPT*/'. Neto al mes, con el IRPF del año entero; debajo, bruto y retención.</p>';
  s+=tabla(['Año','Pensión','Neto al mes'],PE.filas.map(e=>{
    const marca=e.fecha===F.fVoluntaria||e.fecha===(F.fVoluntaria>F.fCarencia?F.fVoluntaria:F.fCarencia)?'voluntaria':(e.esForzosa?'forzosa':(e.necesitaPermiso?'prórroga':''));

      eur(e.cpMes,0)+'<small>escala '+pct(e.C1,2)+(e.demora?'; demora +'+Math.round(e.demora*100):'')+/*IPT*/(IPT&&e.iptDudoso?'; el +20 % de la IPT, dudoso':'')+/*/IPT*/'</small>',
      '<b>'+eur(e.netoMes,0)+'</b><small>bruto '+eur(e.totalMes,0)+', IRPF '+pct(e.tipo,1)+'</small>'];
    if(e.fecha===elegido.fecha)r.attr=' class="destaca"'; return r;}));
  const dif=PE.max.netoMes-PE.vol.netoMes;
  s+='<p class="pie">Entre irte en '+PE.vol.fecha.slice(0,4)+' y aguantar hasta '+PE.max.fecha.slice(0,4)+' hay <b class="num">'+eur(dif,0)+'</b> al mes netos de diferencia, de por vida. '+
    (PE.tope.peor>PE.tope.anual?'Ojo con el último año: las dos pensiones juntas pasarían el tope de pensiones públicas ('+eur(PE.tope.anual,0)+' al año, a la suma de las dos) y habría recorte. ':'')+
    (PE.gastoMes?'Jubilándote en la forzosa, las dos pensiones cubrirían el <b class="num">'+pct(PE.forz.netoMes/PE.gastoMes)+'</b> de lo que gastas hoy.':'')+'</p>';

function enlazarFuturo(){

  document.querySelectorAll('[data-chip="apo"]').forEach(b=>b.onclick=()=>{const m=b.dataset.v; let r=[];
    if(m==='manual'){FU.apoManual=true;pintar();const e=$('#fu-apo');if(e){e.scrollIntoView({block:'center'});e.focus();}return;}
    FU.apoManual=false;
    cambiar('aportación de la proyección cambiada',()=>E('setProjAporte('+jsq(m)+')'),{respuestas:r});});
  const ao=$('#fu-apo-ok'); if(ao)ao.onclick=()=>{const v=val('fu-apo').trim();if(!v){aviso2('Pon cuánto quieres aportar al mes.',false);return;}
    FU.apoManual=false; cambiar('aportación de la proyección cambiada',()=>E('setProjAporte("manual")'),{respuestas:[v]});};
  const g=$('#pn-guardar'); if(g)g.onclick=()=>{
    const PE=Q('pension',P=>P.pension()), c=PE?PE.cfg:{};
    const campos=['nacimientoFecha','fIngreso','grupoIni','grupo','fGrupo2',/*IPT*/'iptMes','iptPagas','iptPct',/*/IPT*/'edadForzosa','edadMaxProlong','aniosRGSSprevios','ccaa','discapacidad'];
    const bools=[/*IPT*/'ipt20',/*/IPT*/'demoraOn','totaliza','asistencia'];
    cambiar('datos de la pensión guardados',()=>{
      campos.filter(k=>document.getElementById('pn-'+k)).forEach(k=>{const v=val('pn-'+k); if(String(v)!==String(c[k]==null?'':c[k]).replace('.',',')/*IPT*/&&!(k==='iptMes'&&numIn('pn-iptMes')===Number(c.iptMes))/*/IPT*/) E('setPension('+jsq(k)+','+jsq(v)+')');});
      bools.filter(k=>document.getElementById('pn-'+k)).forEach(k=>{const v=$('#pn-'+k).checked; if(v!==!!c[k])E('setPension('+jsq(k)+','+v+')');});
    });};
  const rv=$('#rv-guardar'); if(rv)rv.onclick=()=>{const PE=Q('pension',P=>P.pension()); if(!PE)return;
    cambiar('revalorizaciones guardadas',()=>{
      const d=val('rv-def'); if(d.trim()!=='')E('setPension("revalDefaultPct",'+jsq(d)+')');
      PE.reval.forEach(r=>{['cp'/*IPT*/,'ipt'/*/IPT*/].forEach(k=>{const v=val('rv-'+k+'-'+r.y).trim(), antes=(/*IPT*/k==='cp'?/*/IPT*/r.propioCp/*IPT*/:r.propioIpt/*/IPT*/);
        const vn=v===''?null:Number(v.replace(',','.'))/100; if((vn==null&&antes!=null)||(vn!=null&&(antes==null||Math.abs(vn-antes)>1e-9)))E('setPensionReval('+r.y+','+jsq(k)+','+jsq(v)+')');});});});};
}

    cambiar('tu nombre y tus reglas guardados',()=>{LEG.tmp=o;E('setTitular(__LEG.tmp)');});
  };
  const bc=$('#bz-copia'); if(bc)bc.onclick=()=>{
    const P=puente(); const txt=P.copiaJSON(); const d=new Date(),p=n=>String(n).padStart(2,'0');
    const nombre='patrimonio_datos_'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+'_'+(P.aparato()||'')+'.json';
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download=nombre;

// siempre. Para el resto, las columnas se reconocen por su nombre (fecha,
// concepto, importe o cargo y abono, saldo; producto, ISIN, títulos, precio,

const GV={
  fecha:/^(f\.?\s*(valor|operaci[oó]n|operativa|contable)|fecha|date|datum|data|booking|value date|transaction date|trade date|started date|completed date|date\/time|fecha operaci[oó]n|fecha valor|fecha de operaci[oó]n|fecha ejecuci[oó]n|fecha contable)/i,
  isin:/\bisin\b/i,
  titulos:/t[ií]tulos|^cantidad$|quantity|^qty|shares|acciones|participaciones|^n[uú]mero|units|^nominal|anzahl|quantit[eé]/i,
  precio:/precio|price|cotizaci[oó]n|kurs|cours|pre[çc]o/i,
  comision:/comisi[oó]n|^fee|fees|gastos|costes|commission|comm\/fee|brokerage|geb[uü]hr|frais/i,
  divisa:/^divisa|^moneda|currency|w[äa]hrung|devise/i,
  tipo:/^tipo( de)? operaci[oó]n|^operaci[oó]n$|^side$|buy\/sell|compra\/venta|^type$|^transaction type|^tipo$/i,
  cargo:/^cargo|^debe$|d[eé]bito|^salida|withdraw|money out|paid out|^debit|ausgang|d[eé]bit/i,
  abono:/^abono|^haber$|cr[eé]dito|^entrada|deposit|money in|paid in|^credit|eingang|cr[eé]dit/i,
  saldo:/^saldo|balance|disponible|kontostand|solde/i,
  importe:/^importe|^amount|^cantidad \(|^monto|betrag|montant|proceeds|net amount|^total|valor total|^import|montante|^value$/i,
  valor:/valor de mercado|market value|valor en eur|value in eur|^valoraci[oó]n|^position value|^marktwert|^valeur|valor actual|current value/i,
  producto:/^producto|^product|instrumento|instrument|^valor$|security|s[ií]mbolo|symbol|ticker|^nombre|^name$|activo|asset|wertpapier|^titre/i,
  concepto:/concepto|descrip|detalle|^movimiento|beneficiario|payee|referencia|^texto|asunto|motivo|comercio|details|narrative|counterparty|merchant|memo|verwendungszweck|libell[eé]|descri[çc][aã]o/i
};
const G_ORDEN=['fecha','isin','titulos','precio','comision','divisa','tipo','cargo','abono','saldo','importe','valor','producto','concepto'];
const gTxt=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();
function gFecha(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
  if(typeof v==='number'&&v>20000&&v<80000){ const d=new Date(Math.round((v-25569)*864e5)); return d.toISOString().slice(0,10); }
  const s=gTxt(v);
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if(m){ let d=+m[1], mo=+m[2], y=+m[3]; if(y<100)y+=2000; if(mo>12&&d<=12){const t=d;d=mo;mo=t;}
    if(mo<1||mo>12||d<1||d>31)return null; return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
  const MES={ene:1,jan:1,feb:2,mar:3,abr:4,apr:4,may:5,jun:6,jul:7,ago:8,aug:8,sep:9,set:9,oct:10,okt:10,nov:11,dic:12,dec:12,dez:12};
  m=s.toLowerCase().match(/^(\d{1,2})[\s.-]+([a-zé]{3})[a-zé]*\.?[\s.-]+(\d{4})/); if(m&&MES[m[2]])return m[3]+'-'+String(MES[m[2]]).padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return null;
}
function gNum(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  let s=gTxt(v).replace(/[€$£\s]|EUR|USD|GBP|CHF/gi,'');
  if(!s)return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  if(/-$/.test(s)){neg=true;s=s.slice(0,-1);}
  if(/^[+-]/.test(s)){neg=s[0]==='-';s=s.slice(1);}
  if(!/^[\d.,']+$/.test(s))return null;
  s=s.replace(/'/g,'');
  const c=s.lastIndexOf(','), p=s.lastIndexOf('.');
  if(c>=0&&p>=0){ s=c>p?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,''); }
  else if(c>=0){ s=(/^\d{1,3}(,\d{3})+$/.test(s)&&s.split(',').pop().length===3&&!/^0,/.test(s))?s.replace(/,/g,''):s.replace(',','.'); }
  else if(p>=0&&/^\d{1,3}(\.\d{3})+$/.test(s)){ s=s.replace(/\./g,''); }
  const n=Number(s); if(!isFinite(n))return null; return neg?-n:n;
}
// La fila de cabeceras y qué columna es cada cosa
function gCabecera(rows){
  let mejor=null;
  for(let i=0;i<Math.min(40,rows.length);i++){
    const r=(rows[i]||[]).map(gTxt); if(r.filter(Boolean).length<2)continue;
    const cols={}, usado=new Set();
    G_ORDEN.forEach(k=>{ const j=r.findIndex((c,jj)=>c&&!usado.has(jj)&&GV[k].test(c)); if(j>=0){cols[k]=j;usado.add(j);} });
    const has=k=>cols[k]!=null;
    let clase=null, pts=0;
    if(has('titulos')&&(has('producto')||has('isin'))&&(has('precio')||has('importe'))&&has('fecha')){clase='ops';pts=10;}
    else if(has('titulos')&&(has('producto')||has('isin'))&&(has('valor')||has('importe'))&&!has('fecha')){clase='pos';pts=9;}
    else if(has('fecha')&&(has('importe')||has('cargo')||has('abono'))&&(has('concepto')||has('producto'))){clase='banco';pts=8;
      if(!has('concepto')&&has('producto')){cols.concepto=cols.producto;delete cols.producto;}}
    if(clase&&(!mejor||pts>mejor.pts))mejor={hi:i,cols,clase,pts,cab:r};
  }
  return mejor;
}
// ¿lo lee ya la app de siempre? (Bankinter y la exportación de Trade Republic)
function gNativo(rows){
  const hi=rows.findIndex(r=>(r||[]).some(c=>/descrip|description/i.test(c))&&(r||[]).some(c=>/importe|salida|entrada|amount/i.test(c)));
  if(hi<0)return false;
  const h=rows[hi].map(c=>gTxt(c).toLowerCase());
  if(h.includes('transaction_id')||h.includes('asset_class'))return true;
  const d=h.findIndex(c=>c==='date')>=0||h.findIndex(c=>/fecha|date/.test(c))>=0;
  return d&&h.findIndex(c=>/descrip|concepto|description/.test(c))>=0;
}
function gFirma(cab){ return (cab||[]).map(c=>gTxt(c).toLowerCase()).join('|').slice(0,300); }
function gMapaGuardado(firma){ try{ return (JSON.parse(ALM.getItem('dlv2_mapas')||'{}'))[firma]||null; }catch(e){ return null; } }
function gGuardaMapa(firma,m){ try{ const o=JSON.parse(ALM.getItem('dlv2_mapas')||'{}'); o[firma]=m; ALM.setItem('dlv2_mapas',JSON.stringify(o)); }catch(e){} }
// Filas de datos ya interpretadas
function gFilas(rows,m){
  const out=[];
  for(let i=m.hi+1;i<rows.length;i++){
    const r=rows[i]||[]; const g=k=>m.cols[k]!=null?r[m.cols[k]]:null;
    if(m.clase==='banco'){
      const f=gFecha(g('fecha')); if(!f)continue;
      let imp=m.cols.importe!=null?gNum(g('importe')):null;
      if(imp==null&&(m.cols.cargo!=null||m.cols.abono!=null)){ const c=gNum(g('cargo')), a=gNum(g('abono'));
        if(c==null&&a==null)continue; imp=(a?Math.abs(a):0)-(c?Math.abs(c):0); }
      if(imp==null||imp===0)continue;
      out.push({fecha:f,concepto:gTxt(g('concepto'))||'(sin concepto)',importe:imp,saldo:m.cols.saldo!=null?gNum(g('saldo')):null});
    } else if(m.clase==='ops'){
      const f=gFecha(g('fecha')); const n=gNum(g('titulos')); if(!f||!n)continue;
      const tipo=gTxt(g('tipo')).toLowerCase();
      let lado=/venta|sell|sale|vend|reembolso|verkauf/.test(tipo)?'venta':(/compra|buy|purchase|suscrip|kauf|achat/.test(tipo)?'compra':(n<0?'venta':'compra'));
      const imp=gNum(g('importe')), pr=gNum(g('precio'));
      out.push({fecha:f,producto:gTxt(g('producto')),isin:gTxt(g('isin')).toUpperCase(),lado,titulos:Math.abs(n),precio:pr!=null?Math.abs(pr):null,
        importe:imp!=null?Math.abs(imp):null,comision:Math.abs(gNum(g('comision'))||0),divisa:(gTxt(g('divisa'))||'EUR').toUpperCase().slice(0,3)});
    } else {
      const n=gNum(g('titulos')), v=gNum(g('valor')!=null?g('valor'):g('importe')); if(!n||v==null)continue;
      out.push({producto:gTxt(g('producto')),isin:gTxt(g('isin')).toUpperCase(),titulos:Math.abs(n),valor:Math.abs(v),fecha:m.cols.fecha!=null?gFecha(g('fecha')):null});
    }
  }
  return out;
}
function gMapa(it,rows){
  if(it.opc&&it.opc.mapa)return it.opc.mapa;
  const a=gCabecera(rows); if(!a)return null;
  const guardado=gMapaGuardado(gFirma(a.cab));
  return guardado?Object.assign({},a,guardado,{hi:a.hi}):a;
}
// Lo que se enseña para elegir columnas
function gColumnas(rows){
  const a=gCabecera(rows); let hi=a?a.hi:0;
  if(!a){ for(let i=0;i<Math.min(40,rows.length);i++){ if((rows[i]||[]).filter(c=>gTxt(c)).length>=3){hi=i;break;} } }
  const cab=(rows[hi]||[]).map((c,j)=>{ const ej=rows.slice(hi+1,hi+4).map(r=>gTxt((r||[])[j])).filter(Boolean)[0]||''; return [j,(gTxt(c)||'Columna '+(j+1))+(ej?' ('+ej.slice(0,18)+')':'')]; });
  return {hi,cab,a};
}
// Cuenta del banco: la elegida, o la que se parezca por nombre
function gCanonBanco(F){

    out.push([d+'/'+m+'/'+y,x.concepto,String(x.importe.toFixed(2)).replace('.',','),x.saldo==null?'':String(x.saldo.toFixed(2)).replace('.',',')]); });

// ─── Aplicar con el motor de siempre ─────────────────────────────────
function gBuscarAccion(x){
  const S=E('cfg.stocks')||[];
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b(s\.?a\.?|s\.?e\.?|plc|inc\.?|ag|n\.?v\.?|corp\.?|ltd\.?|group|sas|spa|s\.?p\.?a\.?|class [a-z])\b/g,'').replace(/[^a-z0-9]/g,'');
  if(x.isin){ const s=S.find(s=>String(s.isin||'').toUpperCase()===x.isin); if(s)return s; }
  const n=norm(x.producto); if(!n)return null;
  return S.find(s=>norm(s.name)===n)||S.find(s=>{const m=norm(s.name);return m&&(m.startsWith(n)||n.startsWith(m));})||null;
}
function gOps(F){
  const T=E('transactions')||[], res={compras:0,ventas:0,repetidas:0,sinAccion:[],sinCambio:[]};
  F.forEach(x=>{
    const s=gBuscarAccion(x);
    if(s&&T.some(t=>t.stockId===s.id&&t.type===(x.lado==='venta'?'sell':'buy')&&t.date===x.fecha&&Math.abs((t.shares||0)-x.titulos)<1e-4)){res.repetidas++;return;}
    let pr=x.precio, cur=x.divisa||'EUR';
    if(x.importe!=null&&x.titulos>0&&(cur==='EUR'||x.precio==null)){ pr=(x.importe-(x.lado==='compra'?0:0))/x.titulos; cur='EUR'; }
    if(pr==null){res.sinCambio.push(x.producto||x.isin);return;}
    if(cur!=='EUR'){res.sinCambio.push(x.producto||x.isin);return;}
    const fijar=(id,v)=>FD.__fijar(id,{value:String(v)});
    if(x.lado==='compra'){
      fijar('ns-edit-id','');fijar('ns-name',s?s.name:(x.producto||x.isin));fijar('ns-date',x.fecha);fijar('ns-shares',x.titulos);fijar('ns-cur','EUR');
      fijar('ns-price',pr);fijar('ns-rate','');fijar('ns-costs',x.comision||0);fijar('ns-mktval','');fijar('ns-idea','');fijar('ns-idea-otros','');fijar('ns-setup','');
      E('addStockBuy()'); res.compras++;
      if(x.isin){ const n=gBuscarAccion({producto:s?s.name:x.producto}); if(n&&!n.isin)n.isin=x.isin; }
    } else {
      if(!s){res.sinAccion.push(x.producto||x.isin);return;}
      fijar('sv-edit-id','');fijar('sv-stock',s.id);fijar('sv-date',x.fecha);fijar('sv-shares',x.titulos);fijar('sv-cur','EUR');fijar('sv-price',pr);
      fijar('sv-rate','');fijar('sv-costs',x.comision||0);fijar('sv-exit','');FD.__fijar('sv-full',{checked:false});
      E('addStockSell()'); res.ventas++;
    }
  });
  E('save()');
  return res;
}
function gPos(F,fechaArchivo){
  const res={valoradas:0,sinAccion:[]};
  F.forEach(x=>{
    const s=gBuscarAccion(x); if(!s){res.sinAccion.push(x.producto||x.isin);return;}
    const f=x.fecha||fechaArchivo;

  });

}
// ─── Enganches con el buzón ─────────────────────────────────────────
(function(){
  const d0=detectar, e0=ejecutar, t0=tarjeta, ds0=describir, ap0=aplicable, en0=enlazarBuzon;
  detectar=async function(file){
    const it=await d0(file);
    if(it.tipo==='banco'){
      try{ const F=E('bankFilas')(it.buf); it.filas0=F;
        if(F&&F.length&&!gNativo(F)){ const a=gCabecera(F); if(a&&a.clase==='ops')it.tipo='g_ops'; else if(a&&a.clase==='pos')it.tipo='g_pos'; else it.generico=true; }
      }catch(e){}
    }
    return it;
  };
  ejecutar=async function(it){
    if(it.tipo==='banco'&&it.generico){
      const F=it.filas0||E('bankFilas')(it.buf); const m=gMapa(it,F);

// ════════════════════════════════════════════════════════════════════
// ARCHIVOS .ZIP (XTB los da así: un .zip con el Excel dentro)
// ════════════════════════════════════════════════════════════════════
// Se abren con el descompresor del propio navegador, no con el lector de
// Excel, que en el iPad podía fallar con el .zip. Cada hoja de cálculo, CSV o
// PDF de dentro entra en el buzón como si lo hubieras echado tú.
async function abrirZip(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  if(!(buf[0]===0x50&&buf[1]===0x4B))return null;
  let eocd=-1;
  for(let i=buf.length-22;i>=Math.max(0,buf.length-65557);i--){ if(buf[i]===0x50&&buf[i+1]===0x4B&&buf[i+2]===0x05&&buf[i+3]===0x06){eocd=i;break;} }
  if(eocd<0)return null;
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);
  const n=dv.getUint16(eocd+10,true), cd=dv.getUint32(eocd+16,true), td=new TextDecoder();
  const ent=[]; let p=cd;
  for(let k=0;k<n&&p+46<=buf.length;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    ent.push({nombre:td.decode(buf.subarray(p+46,p+46+nl)),metodo:dv.getUint16(p+10,true),csz:dv.getUint32(p+20,true),loff:dv.getUint32(p+42,true)});
    p+=46+nl+xl+cl;
  }
  // un .xlsx también es un zip por dentro: ese no se abre, se lee tal cual
  if(ent.some(e=>e.nombre==='[Content_Types].xml'))return null;
  const out=[];
  for(const e of ent){
    if(/\/$/.test(e.nombre)||/^__MACOSX\//.test(e.nombre)||!/\.(xlsx|xlsm|xls|csv|txt|pdf)$/i.test(e.nombre))continue;
    if(dv.getUint32(e.loff,true)!==0x04034b50)continue;
    const ini=e.loff+30+dv.getUint16(e.loff+26,true)+dv.getUint16(e.loff+28,true), datos=buf.subarray(ini,ini+e.csz);
    let bytes=null;
    if(e.metodo===0)bytes=datos.slice();
    else if(e.metodo===8&&typeof DecompressionStream==='function'){
      try{ bytes=new Uint8Array(await new Response(new Blob([datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); }catch(err){ bytes=null; }
    }
    if(!bytes&&typeof XLSX!=='undefined'){   // navegador sin descompresor: el del lector de Excel
      try{ const c=XLSX.CFB.read(buf,{type:'array'}); const i=c.FullPaths.findIndex(x=>x.endsWith(e.nombre)); if(i>=0)bytes=new Uint8Array(c.FileIndex[i].content); }catch(err){}
    }
    if(bytes){ const f=new File([bytes],e.nombre.split('/').pop(),{lastModified:file.lastModified}); f.__zip=file.name; out.push(f); }
  }
  return out;
}
